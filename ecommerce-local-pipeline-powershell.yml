# ============================================================
# ecommerce-local-pipeline-powershell.yml
#
# Local CI/CD – PowerShell / Windows agent version
#
# Agent:
#   Pool  : e-commerce-pool
#   Agent : Windows agent (must match WIN_AGENT in variable group)
#
# Target:
#   Local Docker Desktop (Linux containers mode recommended)
#
# Compose:
#   docker-compose-cicd.yml
#
# Flow:
#   Unit Tests
#       ↓
#   Build Images
#       ↓
#   Verify Images
#       ↓
#   Trivy Scan + HIGH/CRITICAL Gate
#       ↓
#   Syft SBOM
#       ↓
#   SARIF Conversion
#       ↓
#   Publish Security Artifacts
#       ↓
#   Clean previous stack
#       ↓
#   Docker Compose Deploy
#       ↓
#   Health Checks
#       ↓
#   Smoke Tests
#
# Key improvements:
#   - SERVICES list comes from variable group (single source of truth)
#   - Uses environment variables (no secret files needed)
#   - Previous stack cleaned with down -v
#   - Explicit --project-name used
#
# IMPORTANT:
# Build / Scan / SBOM / Deploy / Smoke Test run in the
# SAME JOB so Docker images remain available on the same
# Docker daemon.
# ============================================================

trigger:
    branches:
        include:
            - feature/cicd
            - staging

pr: none

variables:
    - group: ecommerce-local
    - name: IMAGE_TAG
      value: $(Build.SourceVersion)
    - name: COMPOSE_FILE
      value: docker-compose-cicd.yml
    - name: COMPOSE_PROJECT_NAME
      value: ecommerce-local

pool:
    name: $(AGENT_POOL)
    demands:
        - Agent.Name -equals $(WIN_AGENT)

stages:
    # ============================================================
    # STAGE 1 – UNIT TESTS
    # ============================================================
    - stage: Test
      displayName: "Unit Tests"
      jobs:
          - job: UnitTests
            displayName: "Run Maven unit tests"
            steps:
                - checkout: self
                  clean: true
                  fetchDepth: 1

                - task: PowerShell@2
                  displayName: "Run unit tests"
                  inputs:
                      targetType: inline
                      script: |
                          $ErrorActionPreference = "Stop"

                          if ([string]::IsNullOrWhiteSpace("$(SERVICES)")) {
                              throw "Pipeline variable SERVICES is empty. Check the ecommerce-local variable group."
                          }
                          $services = "$(SERVICES)".Trim() -split '\s+' | Where-Object { $_ -ne '' }

                          Write-Host "=============================================="
                          Write-Host "Running unit tests"
                          Write-Host "Services : $($services -join ', ')"
                          Write-Host "=============================================="

                          foreach ($service in $services) {
                              $servicePath = Join-Path "$(Build.SourcesDirectory)" $service
                              $pomPath     = Join-Path $servicePath "pom.xml"

                              if (-not (Test-Path $pomPath)) {
                                  throw "pom.xml not found for $service"
                              }

                              Write-Host ""
                              Write-Host "----------------------------------------------"
                              Write-Host "Testing: $service"
                              Write-Host "----------------------------------------------"

                              Push-Location $servicePath
                              try {
                                  if (-not (Test-Path ".\mvnw.cmd")) {
                                      throw "mvnw.cmd not found in $service"
                                  }
                                  & .\mvnw.cmd -B test
                                  if ($LASTEXITCODE -ne 0) {
                                      throw "Tests failed for $service"
                                  }
                              }
                              finally {
                                  Pop-Location
                              }
                          }

                          Write-Host ""
                          Write-Host "=============================================="
                          Write-Host "All module tests passed."
                          Write-Host "=============================================="

                - task: PublishTestResults@2
                  displayName: "Publish test results"
                  condition: succeededOrFailed()
                  inputs:
                      testResultsFormat: "JUnit"
                      testResultsFiles: "**/target/surefire-reports/TEST-*.xml"
                      mergeTestResults: true
                      failTaskOnFailedTests: true
                      testRunTitle: "E-Commerce Local CI"

    # ============================================================
    # STAGE 2 – BUILD + SECURITY + SBOM + DEPLOY + SMOKE
    # ============================================================
    - stage: BuildSecurityDeploy
      displayName: "Build, Scan, SBOM, Deploy & Smoke Test"
      dependsOn: Test
      condition: succeeded()
      jobs:
          - job: BuildSecurityDeploy
            displayName: "Build, secure and deploy local Compose stack"
            steps:
                # =================================================
                # CHECKOUT
                # =================================================
                - checkout: self
                  clean: true
                  fetchDepth: 1

                # =================================================
                # VERIFY DOCKER
                # =================================================
                - task: PowerShell@2
                  displayName: "Verify Docker and Compose"
                  inputs:
                      targetType: inline
                      script: |
                          $ErrorActionPreference = "Stop"
                          Write-Host "=============================================="
                          Write-Host "Docker Environment"
                          Write-Host "=============================================="
                          docker version
                          if ($LASTEXITCODE -ne 0) {
                              throw "Docker is not available."
                          }
                          Write-Host ""
                          Write-Host "=== Docker Compose ==="
                          docker compose version
                          if ($LASTEXITCODE -ne 0) {
                              throw "Docker Compose is not available."
                          }
                          Write-Host ""
                          Write-Host "=== Docker Disk Usage ==="
                          docker system df

                # =================================================
                # VALIDATE COMPOSE
                # =================================================
                - task: PowerShell@2
                  displayName: "Validate Docker Compose configuration"
                  inputs:
                      targetType: inline
                      script: |
                          $ErrorActionPreference = "Stop"
                          Set-Location "$(Build.SourcesDirectory)"
                          Write-Host "Compose file : $(COMPOSE_FILE)"
                          Write-Host "Project      : $(COMPOSE_PROJECT_NAME)"
                          Write-Host "Image tag    : $(IMAGE_TAG)"
                          docker compose `
                              -f "$(COMPOSE_FILE)" `
                              --project-name "$(COMPOSE_PROJECT_NAME)" `
                              config `
                              --quiet
                          if ($LASTEXITCODE -ne 0) {
                              throw "Docker Compose configuration validation failed."
                          }
                          Write-Host "Compose configuration is valid."
                  env:
                      IMAGE_TAG: $(IMAGE_TAG)
                      COMPOSE_PROJECT_NAME: $(COMPOSE_PROJECT_NAME)
                      API_GATEWAY_PORT: $(API_GATEWAY_PORT)
                      PRODUCT_SERVICE_PORT: $(PRODUCT_SERVICE_PORT)
                      INVENTORY_SERVICE_PORT: $(INVENTORY_SERVICE_PORT)
                      ORDER_SERVICE_PORT: $(ORDER_SERVICE_PORT)
                      NOTIFICATION_SERVICE_PORT: $(NOTIFICATION_SERVICE_PORT)
                      MONGO_PORT: $(MONGO_PORT)
                      MONGO_ROOT_USERNAME: $(MONGO_ROOT_USERNAME)
                      MONGO_ROOT_PASSWORD: $(MONGO_ROOT_PASSWORD)
                      MONGO_PRODUCT_USER: $(MONGO_PRODUCT_USER)
                      MONGO_PRODUCT_PASSWORD: $(MONGO_PRODUCT_PASSWORD)
                      PRODUCT_DATABASE: $(PRODUCT_DATABASE)
                      MYSQL_PORT: $(MYSQL_PORT)
                      MYSQL_ROOT_USERNAME: $(MYSQL_ROOT_USERNAME)
                      MYSQL_ROOT_PASSWORD: $(MYSQL_ROOT_PASSWORD)
                      MYSQL_INVENTORY_USERNAME: $(MYSQL_INVENTORY_USERNAME)
                      MYSQL_INVENTORY_PASSWORD: $(MYSQL_INVENTORY_PASSWORD)
                      MYSQL_ORDER_USERNAME: $(MYSQL_ORDER_USERNAME)
                      MYSQL_ORDER_PASSWORD: $(MYSQL_ORDER_PASSWORD)
                      INVENTORY_DATABASE: $(INVENTORY_DATABASE)
                      ORDER_DATABASE: $(ORDER_DATABASE)
                      KAFKA_CLUSTER_ID: $(KAFKA_CLUSTER_ID)
                      KAFKA_NODE_ID: $(KAFKA_NODE_ID)
                      KAFKA_PROCESS_ROLES: $(KAFKA_PROCESS_ROLES)
                      KAFKA_CONTROLLER_QUORUM_VOTERS: $(KAFKA_CONTROLLER_QUORUM_VOTERS)
                      KAFKA_PORT: $(KAFKA_PORT)
                      MAILPIT_UI_PORT: $(MAILPIT_UI_PORT)
                      MAILPIT_SMTP_PORT: $(MAILPIT_SMTP_PORT)
                      GATEWAY_AUTH_USERNAME: $(GATEWAY_AUTH_USERNAME)
                      GATEWAY_AUTH_PASSWORD: $(GATEWAY_AUTH_PASSWORD)
                      GATEWAY_JWT_SECRET: $(GATEWAY_JWT_SECRET)

                # =================================================
                # BUILD DOCKER IMAGES
                # =================================================
                - task: PowerShell@2
                  displayName: "Build Docker images"
                  inputs:
                      targetType: inline
                      script: |
                          $ErrorActionPreference = "Stop"
                          Set-Location "$(Build.SourcesDirectory)"
                          Write-Host "=============================================="
                          Write-Host "Building application images"
                          Write-Host "=============================================="
                          Write-Host "IMAGE_TAG = $(IMAGE_TAG)"
                          docker compose `
                              -f "$(COMPOSE_FILE)" `
                              --project-name "$(COMPOSE_PROJECT_NAME)" `
                              build
                          if ($LASTEXITCODE -ne 0) {
                              throw "Docker Compose build failed."
                          }
                          Write-Host ""
                          Write-Host "=== Built images ==="
                          docker compose `
                              -f "$(COMPOSE_FILE)" `
                              --project-name "$(COMPOSE_PROJECT_NAME)" `
                              images
                  env:
                      IMAGE_TAG: $(IMAGE_TAG)
                      COMPOSE_PROJECT_NAME: $(COMPOSE_PROJECT_NAME)
                      API_GATEWAY_PORT: $(API_GATEWAY_PORT)
                      PRODUCT_SERVICE_PORT: $(PRODUCT_SERVICE_PORT)
                      INVENTORY_SERVICE_PORT: $(INVENTORY_SERVICE_PORT)
                      ORDER_SERVICE_PORT: $(ORDER_SERVICE_PORT)
                      NOTIFICATION_SERVICE_PORT: $(NOTIFICATION_SERVICE_PORT)
                      MONGO_PORT: $(MONGO_PORT)
                      MONGO_ROOT_USERNAME: $(MONGO_ROOT_USERNAME)
                      MONGO_ROOT_PASSWORD: $(MONGO_ROOT_PASSWORD)
                      MONGO_PRODUCT_USER: $(MONGO_PRODUCT_USER)
                      MONGO_PRODUCT_PASSWORD: $(MONGO_PRODUCT_PASSWORD)
                      PRODUCT_DATABASE: $(PRODUCT_DATABASE)
                      MYSQL_PORT: $(MYSQL_PORT)
                      MYSQL_ROOT_USERNAME: $(MYSQL_ROOT_USERNAME)
                      MYSQL_ROOT_PASSWORD: $(MYSQL_ROOT_PASSWORD)
                      MYSQL_INVENTORY_USERNAME: $(MYSQL_INVENTORY_USERNAME)
                      MYSQL_INVENTORY_PASSWORD: $(MYSQL_INVENTORY_PASSWORD)
                      MYSQL_ORDER_USERNAME: $(MYSQL_ORDER_USERNAME)
                      MYSQL_ORDER_PASSWORD: $(MYSQL_ORDER_PASSWORD)
                      INVENTORY_DATABASE: $(INVENTORY_DATABASE)
                      ORDER_DATABASE: $(ORDER_DATABASE)
                      KAFKA_CLUSTER_ID: $(KAFKA_CLUSTER_ID)
                      KAFKA_NODE_ID: $(KAFKA_NODE_ID)
                      KAFKA_PROCESS_ROLES: $(KAFKA_PROCESS_ROLES)
                      KAFKA_CONTROLLER_QUORUM_VOTERS: $(KAFKA_CONTROLLER_QUORUM_VOTERS)
                      KAFKA_PORT: $(KAFKA_PORT)
                      MAILPIT_UI_PORT: $(MAILPIT_UI_PORT)
                      MAILPIT_SMTP_PORT: $(MAILPIT_SMTP_PORT)
                      GATEWAY_AUTH_USERNAME: $(GATEWAY_AUTH_USERNAME)
                      GATEWAY_AUTH_PASSWORD: $(GATEWAY_AUTH_PASSWORD)
                      GATEWAY_JWT_SECRET: $(GATEWAY_JWT_SECRET)

                # =================================================
                # VERIFY EXACT IMAGES BEFORE SCANNING
                # =================================================
                - task: PowerShell@2
                  displayName: "Verify built images"
                  inputs:
                      targetType: inline
                      script: |
                          $ErrorActionPreference = "Stop"
                          $imageTag = "$(IMAGE_TAG)".Trim()
                          if ([string]::IsNullOrWhiteSpace($imageTag)) {
                              throw "IMAGE_TAG pipeline variable is empty"
                          }
                          if ([string]::IsNullOrWhiteSpace("$(SERVICES)")) {
                              throw "Pipeline variable SERVICES is empty. Check the ecommerce-local variable group."
                          }
                          $services = "$(SERVICES)".Trim() -split '\s+' | Where-Object { $_ -ne '' }

                          Write-Host "Using IMAGE_TAG = '$imageTag'"
                          Write-Host "=============================================="
                          Write-Host "Verifying built application images"
                          Write-Host "=============================================="

                          foreach ($service in $services) {
                              $image = "ecommerce/${service}:${imageTag}"
                              Write-Host ""
                              Write-Host "Checking: $image"
                              docker image inspect $image > $null 2>&1
                              if ($LASTEXITCODE -ne 0) {
                                  throw "Expected image does not exist: $image"
                              }
                              Write-Host "OK: $image"
                          }

                # =================================================
                # TRIVY SECURITY SCAN + HIGH/CRITICAL GATE
                # =================================================
                - task: PowerShell@2
                  displayName: "Trivy security scan and gate"
                  inputs:
                      targetType: inline
                      script: |
                          $ErrorActionPreference = "Stop"
                          $imageTag = "$(IMAGE_TAG)".Trim()
                          if ([string]::IsNullOrWhiteSpace($imageTag)) {
                              throw "IMAGE_TAG pipeline variable is empty"
                          }
                          if ([string]::IsNullOrWhiteSpace("$(SERVICES)")) {
                              throw "Pipeline variable SERVICES is empty. Check the ecommerce-local variable group."
                          }
                          $services = "$(SERVICES)".Trim() -split '\s+' | Where-Object { $_ -ne '' }

                          $reportDir = "$(Build.ArtifactStagingDirectory)\security"
                          New-Item -ItemType Directory -Force -Path $reportDir | Out-Null

                          $trivyCache = "$(Agent.TempDirectory)\trivy-cache"
                          New-Item -ItemType Directory -Force -Path $trivyCache | Out-Null

                          $securityFailed = $false

                          Write-Host "=============================================="
                          Write-Host "Trivy Security Scan + Gate"
                          Write-Host "=============================================="
                          Write-Host "Image tag : $imageTag"
                          Write-Host "Report dir: $reportDir"
                          Write-Host "Cache dir : $trivyCache"
                          Write-Host "Services  : $($services -join ', ')"

                          foreach ($service in $services) {
                              $image  = "ecommerce/${service}:${imageTag}"
                              $report = "${service}-${imageTag}-trivy.json"

                              Write-Host ""
                              Write-Host "=============================================="
                              Write-Host "Scanning: $image"
                              Write-Host "=============================================="

                              docker run --rm `
                                  -v /var/run/docker.sock:/var/run/docker.sock `
                                  -v "${trivyCache}:/root/.cache/trivy" `
                                  -v "${reportDir}:/out" `
                                  -v "$(Build.SourcesDirectory):/src:ro" `
                                  "aquasec/trivy:$(TRIVY_VERSION)" `
                                  image `
                                  --scanners vuln,secret,misconfig `
                                  --format json `
                                  --output "/out/$report" `
                                  --severity CRITICAL,HIGH `
                                  --ignore-unfixed `
                                  --ignorefile /src/.trivyignore `
                                  --exit-code 1 `
                                  --no-progress `
                                  $image

                              $trivyExitCode = $LASTEXITCODE

                              if (-not (Test-Path "$reportDir\$report")) {
                                  Write-Host "##vso[task.logissue type=error]Trivy report was not created for $service."
                                  throw "Trivy report was not created for $service."
                              }

                              if ($trivyExitCode -ne 0) {
                                  Write-Host ""
                                  Write-Host "##vso[task.logissue type=error]$service failed the Trivy HIGH/CRITICAL security gate."
                                  $securityFailed = $true
                              }
                              else {
                                  Write-Host ""
                                  Write-Host "$service passed Trivy security gate."
                              }
                          }

                          Write-Host ""
                          Write-Host "=============================================="
                          Write-Host "Trivy scan summary"
                          Write-Host "=============================================="
                          if ($securityFailed) {
                              Write-Host "##vso[task.logissue type=error]One or more images failed the Trivy HIGH/CRITICAL security gate."
                              throw "Trivy security gate failed."
                          }
                          Write-Host "All images passed Trivy security gate."

                # =================================================
                # SYFT SBOM
                # =================================================
                - task: PowerShell@2
                  displayName: "Generate Syft SBOMs"
                  inputs:
                      targetType: inline
                      script: |
                          $ErrorActionPreference = "Stop"
                          $imageTag = "$(IMAGE_TAG)".Trim()
                          if ([string]::IsNullOrWhiteSpace($imageTag)) {
                              throw "IMAGE_TAG pipeline variable is empty"
                          }
                          if ([string]::IsNullOrWhiteSpace("$(SERVICES)")) {
                              throw "Pipeline variable SERVICES is empty. Check the ecommerce-local variable group."
                          }
                          $services = "$(SERVICES)".Trim() -split '\s+' | Where-Object { $_ -ne '' }

                          $reportDir = "$(Build.ArtifactStagingDirectory)\security"
                          New-Item -ItemType Directory -Force -Path $reportDir | Out-Null

                          foreach ($service in $services) {
                              $image = "ecommerce/${service}:${imageTag}"
                              Write-Host ""
                              Write-Host "=============================================="
                              Write-Host "Generating SBOM"
                              Write-Host $image
                              Write-Host "=============================================="

                              docker run --rm `
                                  -v /var/run/docker.sock:/var/run/docker.sock `
                                  -v "${reportDir}:/out" `
                                  "anchore/syft:$(SYFT_VERSION)" `
                                  $image `
                                  -o "spdx-json=/out/${service}-${imageTag}.spdx.json" `
                                  -o "syft-json=/out/${service}-${imageTag}.syft.json"

                              if ($LASTEXITCODE -ne 0) {
                                  throw "Syft failed for $service."
                              }
                              if (-not (Test-Path "$reportDir\${service}-${imageTag}.spdx.json")) {
                                  throw "SPDX SBOM was not created for $service."
                              }
                              if (-not (Test-Path "$reportDir\${service}-${imageTag}.syft.json")) {
                                  throw "Syft SBOM was not created for $service."
                              }
                              Write-Host "SBOM generated successfully for $service."
                          }

                # =================================================
                # CONVERT TRIVY REPORTS TO SARIF
                # =================================================
                - task: PowerShell@2
                  displayName: "Convert Trivy reports to SARIF"
                  condition: succeededOrFailed()
                  inputs:
                      targetType: inline
                      script: |
                          $ErrorActionPreference = "Stop"
                          $imageTag = "$(IMAGE_TAG)".Trim()
                          if ([string]::IsNullOrWhiteSpace($imageTag)) {
                              throw "IMAGE_TAG pipeline variable is empty"
                          }
                          if ([string]::IsNullOrWhiteSpace("$(SERVICES)")) {
                              throw "Pipeline variable SERVICES is empty. Check the ecommerce-local variable group."
                          }
                          $services = "$(SERVICES)".Trim() -split '\s+' | Where-Object { $_ -ne '' }

                          $reportDir = "$(Build.ArtifactStagingDirectory)\security"

                          foreach ($service in $services) {
                              $jsonFile  = "$reportDir\${service}-${imageTag}-trivy.json"
                              $sarifFile = "${service}-${imageTag}-trivy.sarif"

                              if (-not (Test-Path $jsonFile)) {
                                  Write-Host "WARNING: Missing Trivy report: $jsonFile"
                                  continue
                              }

                              Write-Host ""
                              Write-Host "Converting Trivy report for $service"

                              docker run --rm `
                                  -v "${reportDir}:/out" `
                                  "aquasec/trivy:$(TRIVY_VERSION)" `
                                  convert `
                                  --format sarif `
                                  --output "/out/$sarifFile" `
                                  "/out/${service}-${imageTag}-trivy.json"

                              if ($LASTEXITCODE -ne 0) {
                                  throw "SARIF conversion failed for $service."
                              }
                              if (-not (Test-Path "$reportDir\$sarifFile")) {
                                  throw "SARIF report was not created for $service."
                              }
                          }

                # =================================================
                # PUBLISH SECURITY ARTIFACTS
                # =================================================
                - task: PublishPipelineArtifact@1
                  displayName: "Publish security artifacts"
                  condition: succeededOrFailed()
                  inputs:
                      targetPath: "$(Build.ArtifactStagingDirectory)/security"
                      artifact: "local-security-$(Build.BuildId)-attempt-$(System.JobAttempt)"
                      publishLocation: pipeline

                # =================================================
                # CLEAN PREVIOUS STATE
                # =================================================
                - task: PowerShell@2
                  displayName: "Clean previous Compose stack"
                  inputs:
                      targetType: inline
                      script: |
                          $ErrorActionPreference = "Continue"
                          Set-Location "$(Build.SourcesDirectory)"
                          Write-Host "Removing previous stack and volumes (safe for CI)..."
                          docker compose `
                              -f "$(COMPOSE_FILE)" `
                              --project-name "$(COMPOSE_PROJECT_NAME)" `
                              down -v --remove-orphans 2>$null
                          Write-Host "Cleanup finished."

                # =================================================
                # VERIFY EXACT IMAGES BEFORE DEPLOYMENT
                # =================================================
                - task: PowerShell@2
                  displayName: "Verify exact images before deployment"
                  inputs:
                      targetType: inline
                      script: |
                          $ErrorActionPreference = "Stop"
                          $imageTag = "$(IMAGE_TAG)".Trim()
                          if ([string]::IsNullOrWhiteSpace($imageTag)) {
                              throw "IMAGE_TAG pipeline variable is empty"
                          }
                          if ([string]::IsNullOrWhiteSpace("$(SERVICES)")) {
                              throw "Pipeline variable SERVICES is empty. Check the ecommerce-local variable group."
                          }
                          $services = "$(SERVICES)".Trim() -split '\s+' | Where-Object { $_ -ne '' }

                          Write-Host "Using IMAGE_TAG = '$imageTag'"
                          Write-Host "=============================================="
                          Write-Host "Pre-deployment image verification"
                          Write-Host "=============================================="

                          foreach ($service in $services) {
                              $expected = "ecommerce/${service}:${imageTag}"
                              Write-Host "Checking $expected"
                              docker image inspect $expected > $null 2>&1
                              if ($LASTEXITCODE -ne 0) {
                                  throw "Scanned image is missing: $expected"
                              }
                              Write-Host "Verified: $expected"
                          }

                # =================================================
                # DOCKER COMPOSE DEPLOY
                # =================================================
                - task: PowerShell@2
                  displayName: "Deploy scanned images"
                  inputs:
                      targetType: inline
                      script: |
                          $ErrorActionPreference = "Stop"
                          Set-Location "$(Build.SourcesDirectory)"

                          Write-Host "=============================================="
                          Write-Host "Docker Compose Deployment"
                          Write-Host "=============================================="
                          Write-Host "Compose file : $(COMPOSE_FILE)"
                          Write-Host "Project      : $(COMPOSE_PROJECT_NAME)"
                          Write-Host "Image tag    : $(IMAGE_TAG)"
                          Write-Host "Commit       : $(Build.SourceVersion)"
                          Write-Host "=============================================="

                          # --no-build guarantees we use the already-scanned images
                          docker compose `
                              -f "$(COMPOSE_FILE)" `
                              --project-name "$(COMPOSE_PROJECT_NAME)" `
                              up `
                              --detach `
                              --no-build `
                              --remove-orphans `
                              --wait `
                              --wait-timeout 300

                          if ($LASTEXITCODE -ne 0) {
                              throw "Docker Compose deployment failed."
                          }

                          Write-Host ""
                          Write-Host "=== Compose status ==="
                          docker compose `
                              -f "$(COMPOSE_FILE)" `
                              --project-name "$(COMPOSE_PROJECT_NAME)" `
                              ps
                  env:
                      IMAGE_TAG: $(IMAGE_TAG)
                      COMPOSE_PROJECT_NAME: $(COMPOSE_PROJECT_NAME)
                      API_GATEWAY_PORT: $(API_GATEWAY_PORT)
                      PRODUCT_SERVICE_PORT: $(PRODUCT_SERVICE_PORT)
                      INVENTORY_SERVICE_PORT: $(INVENTORY_SERVICE_PORT)
                      ORDER_SERVICE_PORT: $(ORDER_SERVICE_PORT)
                      NOTIFICATION_SERVICE_PORT: $(NOTIFICATION_SERVICE_PORT)
                      MONGO_PORT: $(MONGO_PORT)
                      MONGO_ROOT_USERNAME: $(MONGO_ROOT_USERNAME)
                      MONGO_ROOT_PASSWORD: $(MONGO_ROOT_PASSWORD)
                      MONGO_PRODUCT_USER: $(MONGO_PRODUCT_USER)
                      MONGO_PRODUCT_PASSWORD: $(MONGO_PRODUCT_PASSWORD)
                      PRODUCT_DATABASE: $(PRODUCT_DATABASE)
                      MYSQL_PORT: $(MYSQL_PORT)
                      MYSQL_ROOT_USERNAME: $(MYSQL_ROOT_USERNAME)
                      MYSQL_ROOT_PASSWORD: $(MYSQL_ROOT_PASSWORD)
                      MYSQL_INVENTORY_USERNAME: $(MYSQL_INVENTORY_USERNAME)
                      MYSQL_INVENTORY_PASSWORD: $(MYSQL_INVENTORY_PASSWORD)
                      MYSQL_ORDER_USERNAME: $(MYSQL_ORDER_USERNAME)
                      MYSQL_ORDER_PASSWORD: $(MYSQL_ORDER_PASSWORD)
                      INVENTORY_DATABASE: $(INVENTORY_DATABASE)
                      ORDER_DATABASE: $(ORDER_DATABASE)
                      KAFKA_CLUSTER_ID: $(KAFKA_CLUSTER_ID)
                      KAFKA_NODE_ID: $(KAFKA_NODE_ID)
                      KAFKA_PROCESS_ROLES: $(KAFKA_PROCESS_ROLES)
                      KAFKA_CONTROLLER_QUORUM_VOTERS: $(KAFKA_CONTROLLER_QUORUM_VOTERS)
                      KAFKA_PORT: $(KAFKA_PORT)
                      MAILPIT_UI_PORT: $(MAILPIT_UI_PORT)
                      MAILPIT_SMTP_PORT: $(MAILPIT_SMTP_PORT)
                      GATEWAY_AUTH_USERNAME: $(GATEWAY_AUTH_USERNAME)
                      GATEWAY_AUTH_PASSWORD: $(GATEWAY_AUTH_PASSWORD)
                      GATEWAY_JWT_SECRET: $(GATEWAY_JWT_SECRET)

                # =================================================
                # SMOKE TEST – API GATEWAY
                # =================================================
                - task: PowerShell@2
                  displayName: "API Gateway health"
                  inputs:
                      targetType: inline
                      script: |
                          $ErrorActionPreference = "Stop"
                          $url = "http://localhost:$(API_GATEWAY_PORT)/actuator/health"
                          Write-Host "Checking $url"
                          $response = Invoke-WebRequest `
                              -Uri $url `
                              -UseBasicParsing `
                              -TimeoutSec 30
                          if ($response.StatusCode -ne 200) {
                              throw "API Gateway health returned HTTP $($response.StatusCode)."
                          }
                          Write-Host "API Gateway is healthy."

                # =================================================
                # SMOKE TEST – MAILPIT
                # =================================================
                - task: PowerShell@2
                  displayName: "Mailpit readiness"
                  inputs:
                      targetType: inline
                      script: |
                          $ErrorActionPreference = "Stop"
                          $url = "http://localhost:$(MAILPIT_UI_PORT)/readyz"
                          Write-Host "Checking $url"
                          $response = Invoke-WebRequest `
                              -Uri $url `
                              -UseBasicParsing `
                              -TimeoutSec 30
                          if ($response.StatusCode -ne 200) {
                              throw "Mailpit readiness returned HTTP $($response.StatusCode)."
                          }
                          Write-Host "Mailpit is ready."

                # =================================================
                # VERIFY COMPOSE DEPLOYMENT
                # =================================================
                - task: PowerShell@2
                  displayName: "Verify Compose deployment"
                  inputs:
                      targetType: inline
                      script: |
                          $ErrorActionPreference = "Stop"
                          Set-Location "$(Build.SourcesDirectory)"
                          $imageTag = "$(IMAGE_TAG)".Trim()
                          if ([string]::IsNullOrWhiteSpace($imageTag)) {
                              throw "IMAGE_TAG pipeline variable is empty"
                          }
                          if ([string]::IsNullOrWhiteSpace("$(SERVICES)")) {
                              throw "Pipeline variable SERVICES is empty. Check the ecommerce-local variable group."
                          }
                          $services = "$(SERVICES)".Trim() -split '\s+' | Where-Object { $_ -ne '' }

                          Write-Host "=== Compose services ==="
                          docker compose `
                              -f "$(COMPOSE_FILE)" `
                              --project-name "$(COMPOSE_PROJECT_NAME)" `
                              ps
                          if ($LASTEXITCODE -ne 0) {
                              throw "Unable to retrieve Compose service status."
                          }

                          Write-Host ""
                          Write-Host "=== Compose images ==="
                          docker compose `
                              -f "$(COMPOSE_FILE)" `
                              --project-name "$(COMPOSE_PROJECT_NAME)" `
                              images

                          Write-Host ""
                          Write-Host "Expected Git SHA: $imageTag"

                          foreach ($service in $services) {
                              $expected = "ecommerce/${service}:${imageTag}"
                              Write-Host ""
                              Write-Host "Checking $expected"
                              docker image inspect $expected > $null 2>&1
                              if ($LASTEXITCODE -ne 0) {
                                  throw "Expected image does not exist: $expected"
                              }
                              Write-Host "OK: $expected"
                          }

                # =================================================
                # JWT AUTHENTICATION SMOKE TEST
                # =================================================
                - task: PowerShell@2
                  displayName: "JWT authentication smoke test"
                  inputs:
                      targetType: inline
                      script: |
                          $ErrorActionPreference = "Stop"
                          $baseUrl  = "http://localhost:$(API_GATEWAY_PORT)"
                          $loginUrl = "$baseUrl/auth/login"

                          Write-Host "Testing authentication endpoint: $loginUrl"

                          $body = @{
                              username = "$(GATEWAY_AUTH_USERNAME)"
                              password = "$(GATEWAY_AUTH_PASSWORD)"
                          } | ConvertTo-Json

                          try {
                              $loginResponse = Invoke-RestMethod `
                                  -Uri $loginUrl `
                                  -Method Post `
                                  -ContentType "application/json" `
                                  -Body $body `
                                  -TimeoutSec 30
                          }
                          catch {
                              throw "JWT login request failed: $($_.Exception.Message)"
                          }

                          if (-not $loginResponse) {
                              throw "JWT login returned an empty response."
                          }

                          $token = $loginResponse.accessToken
                          if ([string]::IsNullOrWhiteSpace($token)) {
                              throw "JWT accessToken was not returned by /auth/login."
                          }

                          Write-Host "JWT authentication succeeded."

                          $protectedUrl = "$baseUrl/api/inventory/health"
                          Write-Host "Testing protected endpoint: $protectedUrl"

                          $headers = @{
                              Authorization = "Bearer $token"
                          }

                          $protectedResponse = Invoke-WebRequest `
                              -Uri $protectedUrl `
                              -Headers $headers `
                              -Method Get `
                              -UseBasicParsing `
                              -TimeoutSec 30

                          if ($protectedResponse.StatusCode -ne 200) {
                              throw "Protected API returned HTTP $($protectedResponse.StatusCode)."
                          }

                          Write-Host "Protected API authentication succeeded."

                # =================================================
                # DEPLOYMENT SUMMARY
                # =================================================
                - task: PowerShell@2
                  displayName: "Deployment summary"
                  inputs:
                      targetType: inline
                      script: |
                          Write-Host ""
                          Write-Host "=============================================="
                          Write-Host "LOCAL DEPLOYMENT SUCCESSFUL"
                          Write-Host "=============================================="
                          Write-Host "Commit : $(Build.SourceVersion)"
                          Write-Host "Build  : $(Build.BuildId)"
                          Write-Host ""
                          Write-Host "Gateway : http://localhost:$(API_GATEWAY_PORT)"
                          Write-Host "Mailpit : http://localhost:$(MAILPIT_UI_PORT)"
                          Write-Host "=============================================="

                # =================================================
                # FAILURE DIAGNOSTICS
                # =================================================
                - task: PowerShell@2
                  displayName: "Collect Docker Compose diagnostics"
                  condition: failed()
                  inputs:
                      targetType: inline
                      script: |
                          $ErrorActionPreference = "Continue"
                          Set-Location "$(Build.SourcesDirectory)"

                          Write-Host "=============================================="
                          Write-Host "Docker Diagnostics"
                          Write-Host "=============================================="

                          Write-Host ""
                          Write-Host "=== Docker Info ==="
                          docker info

                          Write-Host ""
                          Write-Host "=== Docker Disk Usage ==="
                          docker system df

                          Write-Host ""
                          Write-Host "=== Compose Configuration ==="
                          docker compose `
                              -f "$(COMPOSE_FILE)" `
                              --project-name "$(COMPOSE_PROJECT_NAME)" `
                              config

                          Write-Host ""
                          Write-Host "=== Compose Status ==="
                          docker compose `
                              -f "$(COMPOSE_FILE)" `
                              --project-name "$(COMPOSE_PROJECT_NAME)" `
                              ps -a

                          Write-Host ""
                          Write-Host "=== Compose Images ==="
                          docker compose `
                              -f "$(COMPOSE_FILE)" `
                              --project-name "$(COMPOSE_PROJECT_NAME)" `
                              images

                          Write-Host ""
                          Write-Host "=== Container Logs ==="
                          docker compose `
                              -f "$(COMPOSE_FILE)" `
                              --project-name "$(COMPOSE_PROJECT_NAME)" `
                              logs `
                              --no-color `
                              --tail 200

                # =================================================
                # CLEANUP (dangling images only)
                # =================================================
                - task: PowerShell@2
                  displayName: "Docker cleanup"
                  condition: always()
                  inputs:
                      targetType: inline
                      script: |
                          $ErrorActionPreference = "Continue"
                          Write-Host "=============================================="
                          Write-Host "Docker cleanup"
                          Write-Host "=============================================="
                          docker image prune -f
                          Write-Host ""
                          Write-Host "Docker disk usage after cleanup:"
                          docker system df
