# =========================
# General
# =========================
spring.application.name=api-gateway
server.port=${SERVER_PORT:8080}

# =========================
# Swagger Gateway Aggregation
# =========================

springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.config-url=/api-docs/swagger-config

springdoc.swagger-ui.urls[0].name=Product Service
springdoc.swagger-ui.urls[0].url=/api/product/v3/api-docs

springdoc.swagger-ui.urls[1].name=Order Service
springdoc.swagger-ui.urls[1].url=/api/order/v3/api-docs

springdoc.swagger-ui.urls[2].name=Inventory Service
springdoc.swagger-ui.urls[2].url=/api/inventory/v3/api-docs

# =========================
# ACTUATOR
# =========================

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-components=always
management.health.circuitbreakers.enabled=true

# =========================
# Gateway Services
# =========================

gateway.services.inventory-url=${INVENTORY_SERVICE_URL}
gateway.services.product-url=${PRODUCT_SERVICE_URL}
gateway.services.order-url=${ORDER_SERVICE_URL}

# =========================
# LOGGING
# =========================

logging.level.root=INFO
server.forward-headers-strategy=framework
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{Correlation-Id}] [%thread] %logger{36} - %msg%n

management.metrics.tags.application=${spring.application.name}