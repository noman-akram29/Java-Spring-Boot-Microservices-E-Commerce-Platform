spring.application.name=notification-service

server.port=${SERVER_PORT:8084}


# =========================
# KAFKA
# =========================

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS}


spring.kafka.consumer.group-id=notification-service


spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer


spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer


spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer


spring.kafka.consumer.properties.spring.json.value.default.type=com.techie.microservices.notification.event.OrderPlacedEvent


spring.kafka.consumer.properties.spring.json.trusted.packages=com.techie.microservices.notification.event



spring.kafka.consumer.auto-offset-reset=earliest



# =========================
# MAIL
# =========================

spring.mail.host=${SPRING_MAIL_HOST}

spring.mail.port=${SPRING_MAIL_PORT}

spring.mail.username=${SPRING_MAIL_USERNAME}

spring.mail.password=${SPRING_MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true

spring.mail.properties.mail.smtp.starttls.enable=true



# =========================
# ACTUATOR
# =========================

management.endpoints.web.exposure.include=health,info,metrics,prometheus



logging.level.root=INFO

logging.level.com.techie.microservices.notification=INFO