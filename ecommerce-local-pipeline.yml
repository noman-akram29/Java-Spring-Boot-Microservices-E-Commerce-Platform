# ============================================================
# E-Commerce Local CI/CD Pipeline
#
# Purpose:
#   Build, test, scan and deploy the application locally
#   using Docker Compose on the self-hosted Azure DevOps agent.
#
# Target:
#   Developer's local PC / WSL Linux environment
#
# Infrastructure:
#   Docker Engine / Docker Desktop
#
# Does NOT use:
#   - AWS
#   - ECR
#   - Kubernetes
#   - kubectl
#
# Deployment flow:
#
#   Unit Tests
#       ↓
#   Docker Build
#       ↓
#   Trivy Scan
#       ↓
#   Syft SBOM
#       ↓
#   Generate .env + Docker secrets
#       ↓
#   Docker Compose Deploy
#       ↓
#   Smoke Test
#
# IMPORTANT:
#
#   Build, Security and Deploy intentionally target the same
#   self-hosted Docker agent:
#
#       e-commerce-agent
#
#   This allows the SHA-tagged Docker images built during the
#   Build stage to remain available in the Docker daemon for
#   Security scanning and deployment.
#
# IMAGE TAG:
#
#   Build.SourceVersion is used as the immutable image tag.
#
#   Example:
#
#   IMAGE_TAG=3423ec6033cd5bd4a9a339528040047a753e697f
#
#   Images:
#
#   ecommerce/api-gateway:3423ec6033cd5bd4a9a339528040047a753e697f
#   ecommerce/product-service:3423ec6033cd5bd4a9a339528040047a753e697f
#   ecommerce/inventory-service:3423ec6033cd5bd4a9a339528040047a753e697f
#   ecommerce/order-service:3423ec6033cd5bd4a9a339528040047a753e697f
#   ecommerce/notification-service:3423ec6033cd5bd4a9a339528040047a753e697f
#
# SECURITY:
#
#   Secrets are stored in Azure DevOps Variable Group:
#
#       ecommerce-local
#
#   The pipeline generates:
#
#       .env
#       secrets/mysql_root_password.txt
#       secrets/mongo_root_password.txt
#
#   These files are NOT committed to Git.
# ============================================================

# ============================================================
# TRIGGERS
# ============================================================

trigger:
    branches:
        include:
            - feature/cicd
            - staging

pr: none

# ============================================================
# VARIABLES
# ============================================================

variables:
    # Azure DevOps Variable Group.
    #
    # This group must contain all application configuration
    # variables and secrets required by Docker Compose.
    - group: ecommerce-local

    # Docker Compose project name.
    - name: COMPOSE_PROJECT_NAME
      value: ecommerce-local

    # Immutable image tag.
    #
    # Build.SourceVersion = Git commit SHA.
    - name: IMAGE_TAG
      value: $(Build.SourceVersion)

# ============================================================
# AGENT
# ============================================================

pool:
    name: e-commerce-pool

    demands:
        - Agent.Name -equals e-commerce-agent

# ============================================================
# STAGES
# ============================================================

stages:
    # ==========================================================
    # STAGE 1 — UNIT TESTS
    # ==========================================================

    - stage: Test

      displayName: "Run Unit Tests"

      jobs:
          - job: UnitTests

            displayName: "Run Maven unit tests"

            steps:
                # --------------------------------------------------
                # Checkout source
                # --------------------------------------------------

                - checkout: self

                  clean: true

                  fetchDepth: 1

                # --------------------------------------------------
                # Verify required variables
                # --------------------------------------------------

                - bash: |

                      set -euo pipefail

                      echo "============================================"
                      echo "Checking required pipeline variables"
                      echo "============================================"

                      if [ -z "${SERVICES:-}" ]; then
                        echo "ERROR: SERVICES variable is not defined."
                        exit 1
                      fi

                      echo "SERVICES variable is configured."

                      echo ""
                      echo "Services:"
                      echo "${SERVICES}"

                  displayName: "Validate pipeline variables"

                # --------------------------------------------------
                # Maven tests
                # --------------------------------------------------

                - bash: |

                      set -euo pipefail

                      echo "============================================"
                      echo "Running unit tests"
                      echo "============================================"

                      for SERVICE in $(SERVICES); do

                        if [ -f "${SERVICE}/pom.xml" ]; then

                          echo ""
                          echo "--------------------------------------------"
                          echo "Testing ${SERVICE}"
                          echo "--------------------------------------------"

                          (
                            cd "${SERVICE}"

                            chmod +x mvnw

                            ./mvnw -B test
                          )

                        else

                          echo ""
                          echo "Skipping ${SERVICE}"
                          echo "No pom.xml found."

                        fi

                      done

                      echo ""
                      echo "============================================"
                      echo "All module tests passed."
                      echo "============================================"

                  displayName: "Run Maven unit tests"

                # --------------------------------------------------
                # Publish JUnit results
                # --------------------------------------------------

                - task: PublishTestResults@2

                  displayName: "Publish test results"

                  condition: succeededOrFailed()

                  inputs:
                      testResultsFormat: "JUnit"

                      testResultsFiles: "**/target/surefire-reports/TEST-*.xml"

                      mergeTestResults: true

                      failTaskOnFailedTests: true

    # ==========================================================
    # STAGE 2 — DOCKER BUILD
    # ==========================================================

    - stage: Build

      displayName: "Build Docker Compose Images"

      dependsOn: Test

      condition: succeeded()

      jobs:
          - job: BuildImages

            displayName: "Build local Docker images"

            steps:
                # --------------------------------------------------
                # Checkout
                # --------------------------------------------------

                - checkout: self

                  clean: true

                  fetchDepth: 1

                # --------------------------------------------------
                # Validate Docker
                # --------------------------------------------------

                - bash: |

                      set -euo pipefail

                      echo "============================================"
                      echo "Docker environment"
                      echo "============================================"

                      docker version

                      echo ""

                      docker compose version

                  displayName: "Validate Docker environment"

                # --------------------------------------------------
                # Validate Compose configuration
                #
                # NOTE:
                #
                # This requires the non-secret Compose variables
                # to be available through the ecommerce-local group.
                #
                # If your Compose file requires secrets for config
                # interpolation, those are generated in Deploy.
                # --------------------------------------------------

                - bash: |

                      set -euo pipefail

                      export IMAGE_TAG="$(Build.SourceVersion)"

                      echo "============================================"
                      echo "Image tag"
                      echo "============================================"

                      echo "IMAGE_TAG=${IMAGE_TAG}"

                      echo ""
                      echo "============================================"
                      echo "Validating Docker Compose configuration"
                      echo "============================================"

                      docker compose \
                        -f docker-compose-cicd.yml \
                        config --quiet

                      echo ""
                      echo "Compose configuration is valid."

                  displayName: "Validate Docker Compose configuration"

                # --------------------------------------------------
                # Build images
                # --------------------------------------------------

                - bash: |

                      set -euo pipefail

                      export IMAGE_TAG="$(Build.SourceVersion)"

                      echo "============================================"
                      echo "Building Docker Compose images"
                      echo "============================================"

                      echo "IMAGE_TAG=${IMAGE_TAG}"

                      docker compose \
                        -f docker-compose-cicd.yml \
                        build --pull

                      echo ""
                      echo "============================================"
                      echo "Verifying application images"
                      echo "============================================"

                      for SERVICE in $(SERVICES); do

                        IMAGE="ecommerce/${SERVICE}:${IMAGE_TAG}"

                        echo ""
                        echo "Checking ${IMAGE}"

                        if ! docker image inspect "${IMAGE}" >/dev/null 2>&1; then

                          echo ""
                          echo "ERROR: Expected image was not built:"
                          echo "${IMAGE}"

                          exit 1

                        fi

                        echo "Found ${IMAGE}"

                      done

                      echo ""
                      echo "============================================"
                      echo "All application images built successfully."
                      echo "============================================"

                  displayName: "Docker Compose build"

    # ==========================================================
    # STAGE 3 — SECURITY
    # ==========================================================

    - stage: Security

      displayName: "Security Scan and SBOM"

      dependsOn: Build

      condition: succeeded()

      jobs:
          - job: SecurityScan

            displayName: "Trivy scan and Syft SBOM"

            steps:
                # --------------------------------------------------
                # Checkout
                # --------------------------------------------------

                - checkout: self

                  clean: true

                  fetchDepth: 1

                # --------------------------------------------------
                # Security scan + SBOM
                # --------------------------------------------------

                - bash: |

                      set -euo pipefail

                      export IMAGE_TAG="$(Build.SourceVersion)"

                      SECURITY_DIR="$(Build.ArtifactStagingDirectory)/security"

                      mkdir -p "${SECURITY_DIR}"

                      echo "============================================"
                      echo "Security scan"
                      echo "============================================"

                      echo "IMAGE_TAG=${IMAGE_TAG}"

                      echo ""
                      echo "============================================"
                      echo "Checking security tool versions"
                      echo "============================================"

                      echo "TRIVY_VERSION=$(TRIVY_VERSION)"
                      echo "SYFT_VERSION=$(SYFT_VERSION)"

                      echo ""
                      echo "============================================"
                      echo "Verifying previously built images"
                      echo "============================================"

                      for SERVICE in $(SERVICES); do

                        IMAGE="ecommerce/${SERVICE}:${IMAGE_TAG}"

                        echo ""
                        echo "Checking ${IMAGE}"

                        if ! docker image inspect "${IMAGE}" >/dev/null 2>&1; then

                          echo ""
                          echo "ERROR: Expected image does not exist:"
                          echo "${IMAGE}"

                          echo ""
                          echo "The Security stage must scan the images"
                          echo "created by the Build stage."

                          exit 1

                        fi

                      done

                      echo ""
                      echo "All expected SHA-tagged images are available."


                      # ==================================================
                      # TRIVY
                      # ==================================================

                      echo ""
                      echo "============================================"
                      echo "Running Trivy scans"
                      echo "============================================"

                      for SERVICE in $(SERVICES); do

                        IMAGE="ecommerce/${SERVICE}:${IMAGE_TAG}"

                        echo ""
                        echo "--------------------------------------------"
                        echo "Trivy: ${IMAGE}"
                        echo "--------------------------------------------"


                        # ------------------------------------------------
                        # Generate JSON report
                        # ------------------------------------------------

                        docker run --rm \
                          -v /var/run/docker.sock:/var/run/docker.sock \
                          -v "$(Build.SourcesDirectory):/src:ro" \
                          -v "${SECURITY_DIR}:/out" \
                          "aquasec/trivy:$(TRIVY_VERSION)" \
                          image \
                          --scanners vuln,secret,misconfig \
                          --format json \
                          --output "/out/${SERVICE}-trivy.json" \
                          --ignorefile /src/.trivyignore \
                          --no-progress \
                          "${IMAGE}"


                        # ------------------------------------------------
                        # Security gate
                        #
                        # Fail only on HIGH and CRITICAL vulnerabilities.
                        # ------------------------------------------------

                        docker run --rm \
                          -v /var/run/docker.sock:/var/run/docker.sock \
                          -v "$(Build.SourcesDirectory):/src:ro" \
                          "aquasec/trivy:$(TRIVY_VERSION)" \
                          image \
                          --scanners vuln,secret,misconfig \
                          --severity CRITICAL,HIGH \
                          --exit-code 1 \
                          --ignore-unfixed \
                          --ignorefile /src/.trivyignore \
                          --no-progress \
                          "${IMAGE}"

                      done

                      echo ""
                      echo "============================================"
                      echo "All application images passed Trivy."
                      echo "============================================"


                      # ==================================================
                      # SYFT
                      # ==================================================

                      echo ""
                      echo "============================================"
                      echo "Generating SBOMs with Syft"
                      echo "============================================"

                      for SERVICE in $(SERVICES); do

                        IMAGE="ecommerce/${SERVICE}:${IMAGE_TAG}"

                        echo ""
                        echo "--------------------------------------------"
                        echo "Syft: ${IMAGE}"
                        echo "--------------------------------------------"


                        # ------------------------------------------------
                        # CycloneDX
                        # ------------------------------------------------

                        docker run --rm \
                          -v /var/run/docker.sock:/var/run/docker.sock \
                          -v "${SECURITY_DIR}:/out" \
                          "anchore/syft:$(SYFT_VERSION)" \
                          scan \
                          "docker:${IMAGE}" \
                          -o "cyclonedx-json=/out/${SERVICE}-sbom-cyclonedx.json"


                        # ------------------------------------------------
                        # SPDX
                        # ------------------------------------------------

                        docker run --rm \
                          -v /var/run/docker.sock:/var/run/docker.sock \
                          -v "${SECURITY_DIR}:/out" \
                          "anchore/syft:$(SYFT_VERSION)" \
                          scan \
                          "docker:${IMAGE}" \
                          -o "spdx-json=/out/${SERVICE}-sbom-spdx.json"

                      done


                      # ==================================================
                      # ARTIFACT LIST
                      # ==================================================

                      echo ""
                      echo "============================================"
                      echo "Security artifacts generated"
                      echo "============================================"

                      find "${SECURITY_DIR}" \
                        -maxdepth 1 \
                        -type f \
                        -print

                  displayName: "Trivy security scan and Syft SBOM"

                # --------------------------------------------------
                # Publish security artifacts
                # --------------------------------------------------

                - task: PublishPipelineArtifact@1

                  displayName: "Publish security reports and SBOMs"

                  condition: succeededOrFailed()

                  inputs:
                      targetPath: "$(Build.ArtifactStagingDirectory)/security"

                      artifact: "local-security-$(Build.BuildId)"

                      publishLocation: "pipeline"

    # ==========================================================
    # STAGE 4 — DEPLOY
    # ==========================================================

    - stage: Deploy

      displayName: "Deploy with Docker Compose"

      dependsOn: Security

      condition: succeeded()

      jobs:
          - job: ComposeDeploy

            displayName: "Deploy local Docker Compose stack"

            steps:
                # --------------------------------------------------
                # Checkout
                # --------------------------------------------------

                - checkout: self

                  clean: true

                  fetchDepth: 1

                # ==================================================
                # GENERATE LOCAL ENVIRONMENT
                # ==================================================
                #
                # Azure DevOps Variable Group does NOT automatically
                # create a .env file.
                #
                # This step creates .env from ecommerce-local.
                #
                # DO NOT print the contents of .env.
                #
                # ==================================================

                - bash: |

                      set -euo pipefail

                      echo "============================================"
                      echo "Preparing local environment"
                      echo "============================================"

                      mkdir -p secrets


                      # ------------------------------------------------
                      # Generate .env
                      # ------------------------------------------------

                      cat > .env <<EOF

                      MYSQL_PORT=${MYSQL_PORT}

                      MYSQL_INVENTORY_USERNAME=${MYSQL_INVENTORY_USERNAME}
                      MYSQL_INVENTORY_PASSWORD=${MYSQL_INVENTORY_PASSWORD}

                      MYSQL_ORDER_USERNAME=${MYSQL_ORDER_USERNAME}
                      MYSQL_ORDER_PASSWORD=${MYSQL_ORDER_PASSWORD}

                      KAFKA_CONTROLLER_QUORUM_VOTERS=${KAFKA_CONTROLLER_QUORUM_VOTERS}
                      KAFKA_CLUSTER_ID=${KAFKA_CLUSTER_ID}
                      KAFKA_NODE_ID=${KAFKA_NODE_ID}
                      KAFKA_PROCESS_ROLES=${KAFKA_PROCESS_ROLES}
                      KAFKA_PORT=${KAFKA_PORT}

                      MAILPIT_UI_PORT=${MAILPIT_UI_PORT}
                      MAILPIT_SMTP_PORT=${MAILPIT_SMTP_PORT}

                      INVENTORY_SERVICE_PORT=${INVENTORY_SERVICE_PORT}
                      PRODUCT_SERVICE_PORT=${PRODUCT_SERVICE_PORT}
                      ORDER_SERVICE_PORT=${ORDER_SERVICE_PORT}
                      NOTIFICATION_SERVICE_PORT=${NOTIFICATION_SERVICE_PORT}
                      API_GATEWAY_PORT=${API_GATEWAY_PORT}

                      MONGO_ROOT_USERNAME=${MONGO_ROOT_USERNAME}
                      MONGO_PRODUCT_USER=${MONGO_PRODUCT_USER}
                      MONGO_PRODUCT_PASSWORD=${MONGO_PRODUCT_PASSWORD}
                      MONGO_PORT=${MONGO_PORT}

                      PRODUCT_DATABASE=${PRODUCT_DATABASE}
                      INVENTORY_DATABASE=${INVENTORY_DATABASE}
                      ORDER_DATABASE=${ORDER_DATABASE}

                      GATEWAY_AUTH_PASSWORD=${GATEWAY_AUTH_PASSWORD}
                      GATEWAY_JWT_SECRET=${GATEWAY_JWT_SECRET}

                      EOF


                      # ------------------------------------------------
                      # Protect .env
                      # ------------------------------------------------

                      chmod 600 .env


                      # ------------------------------------------------
                      # Generate MySQL Docker secret
                      # ------------------------------------------------

                      printf '%s' "${MYSQL_ROOT_PASSWORD}" \
                        > secrets/mysql_root_password.txt


                      # ------------------------------------------------
                      # Generate MongoDB Docker secret
                      # ------------------------------------------------

                      printf '%s' "${MONGO_ROOT_PASSWORD}" \
                        > secrets/mongo_root_password.txt


                      # ------------------------------------------------
                      # Protect secret files
                      # ------------------------------------------------

                      chmod 600 \
                        secrets/mysql_root_password.txt \
                        secrets/mongo_root_password.txt


                      echo ""
                      echo "============================================"
                      echo "Local environment prepared."
                      echo "============================================"

                      echo ".env created."
                      echo "MySQL Docker secret created."
                      echo "MongoDB Docker secret created."

                      echo ""
                      echo "Secret contents are intentionally not displayed."

                  displayName: "Generate local environment and Docker secrets"

                  env:
                      # ------------------------------------------------
                      # MySQL
                      # ------------------------------------------------

                      MYSQL_PORT: $(MYSQL_PORT)

                      MYSQL_INVENTORY_USERNAME: $(MYSQL_INVENTORY_USERNAME)
                      MYSQL_INVENTORY_PASSWORD: $(MYSQL_INVENTORY_PASSWORD)

                      MYSQL_ORDER_USERNAME: $(MYSQL_ORDER_USERNAME)
                      MYSQL_ORDER_PASSWORD: $(MYSQL_ORDER_PASSWORD)

                      MYSQL_ROOT_PASSWORD: $(MYSQL_ROOT_PASSWORD)

                      # ------------------------------------------------
                      # Kafka
                      # ------------------------------------------------

                      KAFKA_CONTROLLER_QUORUM_VOTERS: $(KAFKA_CONTROLLER_QUORUM_VOTERS)
                      KAFKA_CLUSTER_ID: $(KAFKA_CLUSTER_ID)
                      KAFKA_NODE_ID: $(KAFKA_NODE_ID)
                      KAFKA_PROCESS_ROLES: $(KAFKA_PROCESS_ROLES)
                      KAFKA_PORT: $(KAFKA_PORT)

                      # ------------------------------------------------
                      # Mailpit
                      # ------------------------------------------------

                      MAILPIT_UI_PORT: $(MAILPIT_UI_PORT)
                      MAILPIT_SMTP_PORT: $(MAILPIT_SMTP_PORT)

                      # ------------------------------------------------
                      # Services
                      # ------------------------------------------------

                      INVENTORY_SERVICE_PORT: $(INVENTORY_SERVICE_PORT)
                      PRODUCT_SERVICE_PORT: $(PRODUCT_SERVICE_PORT)
                      ORDER_SERVICE_PORT: $(ORDER_SERVICE_PORT)
                      NOTIFICATION_SERVICE_PORT: $(NOTIFICATION_SERVICE_PORT)
                      API_GATEWAY_PORT: $(API_GATEWAY_PORT)

                      # ------------------------------------------------
                      # MongoDB
                      # ------------------------------------------------

                      MONGO_ROOT_USERNAME: $(MONGO_ROOT_USERNAME)
                      MONGO_ROOT_PASSWORD: $(MONGO_ROOT_PASSWORD)

                      MONGO_PRODUCT_USER: $(MONGO_PRODUCT_USER)
                      MONGO_PRODUCT_PASSWORD: $(MONGO_PRODUCT_PASSWORD)

                      MONGO_PORT: $(MONGO_PORT)

                      # ------------------------------------------------
                      # Databases
                      # ------------------------------------------------

                      PRODUCT_DATABASE: $(PRODUCT_DATABASE)
                      INVENTORY_DATABASE: $(INVENTORY_DATABASE)
                      ORDER_DATABASE: $(ORDER_DATABASE)

                      # ------------------------------------------------
                      # Gateway
                      # ------------------------------------------------

                      GATEWAY_AUTH_PASSWORD: $(GATEWAY_AUTH_PASSWORD)
                      GATEWAY_JWT_SECRET: $(GATEWAY_JWT_SECRET)

                # ==================================================
                # VALIDATE GENERATED ENVIRONMENT
                # ==================================================

                - bash: |

                      set -euo pipefail

                      echo "============================================"
                      echo "Validating generated environment"
                      echo "============================================"

                      if [ ! -f ".env" ]; then
                        echo "ERROR: .env was not generated."
                        exit 1
                      fi

                      if [ ! -f "secrets/mysql_root_password.txt" ]; then
                        echo "ERROR: MySQL secret was not generated."
                        exit 1
                      fi

                      if [ ! -f "secrets/mongo_root_password.txt" ]; then
                        echo "ERROR: MongoDB secret was not generated."
                        exit 1
                      fi

                      echo "Required environment files exist."

                  displayName: "Validate generated environment"

                # ==================================================
                # VALIDATE DOCKER COMPOSE
                # ==================================================

                - bash: |

                      set -euo pipefail

                      echo "============================================"
                      echo "Validating Docker Compose configuration"
                      echo "============================================"

                      docker compose \
                        -f docker-compose-cicd.yml \
                        config --quiet

                      echo ""
                      echo "Docker Compose configuration is valid."

                  displayName: "Validate Docker Compose"

                # ==================================================
                # DEPLOY
                # ==================================================

                - bash: |

                      set -euo pipefail

                      export IMAGE_TAG="$(Build.SourceVersion)"

                      echo "============================================"
                      echo "Deployment information"
                      echo "============================================"

                      echo "IMAGE_TAG=${IMAGE_TAG}"

                      echo ""
                      echo "============================================"
                      echo "Stopping previous deployment"
                      echo "============================================"

                      docker compose \
                        -f docker-compose-cicd.yml \
                        down \
                        --remove-orphans || true


                      echo ""
                      echo "============================================"
                      echo "Deploying previously built images"
                      echo "============================================"

                      docker compose \
                        -f docker-compose-cicd.yml \
                        up \
                        -d \
                        --no-build \
                        --remove-orphans \
                        --wait


                      echo ""
                      echo "============================================"
                      echo "Docker Compose deployment successful"
                      echo "============================================"


                      echo ""
                      echo "============================================"
                      echo "Docker Compose state"
                      echo "============================================"

                      docker compose \
                        -f docker-compose-cicd.yml \
                        ps

                  displayName: "Deploy Docker Compose stack"

    # ==========================================================
    # STAGE 5 — SMOKE TEST
    # ==========================================================

    - stage: SmokeTest

      displayName: "Local Smoke Tests"

      dependsOn: Deploy

      condition: succeeded()

      jobs:
          - job: SmokeTests

            displayName: "Verify local application"

            steps:
                # --------------------------------------------------
                # Checkout
                # --------------------------------------------------

                - checkout: self

                  clean: true

                  fetchDepth: 1

                # --------------------------------------------------
                # Smoke test
                # --------------------------------------------------

                - bash: |

                      set -euo pipefail

                      echo "============================================"
                      echo "Application smoke tests"
                      echo "============================================"


                      echo ""
                      echo "Checking API Gateway health..."


                      curl \
                        --fail \
                        --silent \
                        --show-error \
                        --retry 10 \
                        --retry-delay 5 \
                        --retry-connrefused \
                        http://localhost:8080/actuator/health


                      echo ""
                      echo ""
                      echo "API Gateway health check passed."


                      echo ""
                      echo "============================================"
                      echo "Docker Compose state"
                      echo "============================================"


                      docker compose \
                        -f docker-compose-cicd.yml \
                        ps


                      echo ""
                      echo "============================================"
                      echo "LOCAL DEPLOYMENT SUCCESSFUL"
                      echo "============================================"

                  displayName: "Run application smoke tests"

    # ==========================================================
    # STAGE 6 — DIAGNOSTICS
    # ==========================================================
    #
    # Runs when Deploy or SmokeTest fails.
    #
    # We deliberately use the same self-hosted agent so that
    # Docker state and logs can be inspected.
    #
    # ==========================================================

    - stage: Diagnostics

      displayName: "Deployment Diagnostics"

      dependsOn:
          - Deploy
          - SmokeTest

      condition: |
          or(
            failed('Deploy'),
            failed('SmokeTest')
          )

      jobs:
          - job: Diagnostics

            displayName: "Collect Docker Compose diagnostics"

            steps:
                # --------------------------------------------------
                # Checkout
                # --------------------------------------------------

                - checkout: self

                  clean: false

                # --------------------------------------------------
                # Docker Compose status
                # --------------------------------------------------

                - bash: |

                      echo "============================================"
                      echo "Docker Compose status"
                      echo "============================================"

                      docker compose \
                        -f docker-compose-cicd.yml \
                        ps || true


                      echo ""
                      echo "============================================"
                      echo "Docker Compose logs"
                      echo "============================================"

                      docker compose \
                        -f docker-compose-cicd.yml \
                        logs \
                        --tail=200 || true


                      echo ""
                      echo "============================================"
                      echo "Docker containers"
                      echo "============================================"

                      docker ps -a || true


                      echo ""
                      echo "============================================"
                      echo "Docker images"
                      echo "============================================"

                      docker images \
                        "ecommerce/*" || true


                      echo ""
                      echo "============================================"
                      echo "Docker disk usage"
                      echo "============================================"

                      docker system df || true

                  displayName: "Collect deployment diagnostics"
