spring.application.name=product-service

server.port=8082

# MONGODB
# spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://root:password@localhost:27017/product-service?authSource=admin}
spring.data.mongodb.uri=mongodb://root:password@localhost:27017/product-service?authSource=admin

# INVENTORY SERVICE
inventory.service.url=${INVENTORY_SERVICE_URL:http://localhost:8081}

# SWAGGER
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# ACTUATOR
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# LOGGING
logging.level.root=INFO
logging.level.com.techie.microservices.product=DEBUG