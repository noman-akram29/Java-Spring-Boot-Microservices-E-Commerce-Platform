spring.application.name=product-service
server.port=${SERVER_PORT:8082}

# =========================
# MONGODB
# =========================

spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}

# =========================
# INVENTORY SERVICE
# =========================

inventory.service.url=${INVENTORY_SERVICE_URL}

# =========================
# ACTUATOR
# =========================

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-components=always
management.health.circuitbreakers.enabled=true

# =========================
# OPENAPI
# =========================

springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=false

# =========================
# LOGGING
# =========================

logging.level.root=INFO
server.forward-headers-strategy=framework
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{Correlation-Id}] [%thread] %logger{36} - %msg%n

# =========================
# FEIGN
# =========================

spring.cloud.openfeign.client.config.default.connect-timeout=3000
spring.cloud.openfeign.client.config.default.read-timeout=3000
spring.cloud.openfeign.client.config.default.logger-level=basic
