apiVersion: v1
kind: ConfigMap
metadata:
    name: mysql-init-scripts
    namespace: ecommerce
data:
    init.sql: |
        CREATE DATABASE IF NOT EXISTS inventory_db;
        CREATE DATABASE IF NOT EXISTS order_db;

        # -- add to the mysql-init-scripts ConfigMap's init.sql, after the CREATE DATABASE statements
        CREATE USER IF NOT EXISTS 'inventory_app'@'%' IDENTIFIED BY '__INVENTORY_APP_PASSWORD__';
        GRANT ALL PRIVILEGES ON inventory_db.* TO 'inventory_app'@'%';

        CREATE USER IF NOT EXISTS 'order_app'@'%' IDENTIFIED BY '__ORDER_APP_PASSWORD__';
        GRANT ALL PRIVILEGES ON order_db.* TO 'order_app'@'%';

        FLUSH PRIVILEGES;
