apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init-scripts
  namespace: ecommerce
  labels:
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/component: database
data:
  # Passwords here must match the values in the `mysql-creds` Secret
  # (keys: inventory-password, order-password).
  # Applications connect as inventory_app / order_app — never as root.
  init.sql: |
    CREATE DATABASE IF NOT EXISTS inventory_db;
    CREATE DATABASE IF NOT EXISTS order_db;

    CREATE USER IF NOT EXISTS 'inventory_app'@'%' IDENTIFIED BY 'InvAppSecur3Passw0rd!';
    GRANT SELECT, INSERT, UPDATE, DELETE ON inventory_db.* TO 'inventory_app'@'%';

    CREATE USER IF NOT EXISTS 'order_app'@'%' IDENTIFIED BY 'OrdAppSecur3Passw0rd!';
    GRANT SELECT, INSERT, UPDATE, DELETE ON order_db.* TO 'order_app'@'%';

    FLUSH PRIVILEGES;