apiVersion: v1
kind: ConfigMap
metadata:
    name: mysql-init-scripts
    namespace: ecommerce
data:
    init.sql: |
        CREATE DATABASE IF NOT EXISTS inventory_db;
        CREATE DATABASE IF NOT EXISTS order_db;

        CREATE USER IF NOT EXISTS 'inventory_app'@'%' IDENTIFIED BY 'InvAppSecur3Passw0rd!';
        GRANT ALL PRIVILEGES ON inventory_db.* TO 'inventory_app'@'%';

        CREATE USER IF NOT EXISTS 'order_app'@'%' IDENTIFIED BY 'OrdAppSecur3Passw0rd!';
        GRANT ALL PRIVILEGES ON order_db.* TO 'order_app'@'%';

        FLUSH PRIVILEGES;
