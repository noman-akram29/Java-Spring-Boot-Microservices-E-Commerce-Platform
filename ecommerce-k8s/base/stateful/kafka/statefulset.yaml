apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: kafka
    namespace: ecommerce
spec:
    serviceName: kafka
    replicas: 1
    podManagementPolicy: OrderedReady
    selector:
        matchLabels:
            app.kubernetes.io/name: kafka
    template:
        metadata:
            labels:
                app.kubernetes.io/name: kafka
                workload: data
                tier: stateful
        spec:
            nodeSelector:
                workload: data
            tolerations:
                - key: workload
                  operator: Equal
                  value: data
                  effect: NoSchedule
            securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                fsGroup: 1000
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: kafka
                  image: "apache/kafka:3.9.0"
                  imagePullPolicy: IfNotPresent
                  env:
                      - name: KAFKA_NODE_ID
                        value: "0"
                      - name: KAFKA_PROCESS_ROLES
                        value: "broker,controller"
                      - name: KAFKA_LISTENERS
                        value: "PLAINTEXT://:9092,CONTROLLER://:9093"
                      - name: KAFKA_ADVERTISED_LISTENERS
                        value: "PLAINTEXT://kafka-0.kafka.ecommerce.svc.cluster.local:9092"
                      - name: KAFKA_CONTROLLER_QUORUM_VOTERS
                        value: "0@kafka-0.kafka.ecommerce.svc.cluster.local:9093"
                      - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
                        value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
                      - name: KAFKA_CONTROLLER_LISTENER_NAMES
                        value: CONTROLLER
                      - name: KAFKA_INTER_BROKER_LISTENER_NAME
                        value: PLAINTEXT
                      - name: CLUSTER_ID
                        value: 5L6g3nShT-eMCtK--X86sw
                      - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
                        value: "1"
                      - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
                        value: "1"
                      - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
                        value: "1"
                      - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
                        value: "0"
                      - name: KAFKA_LOG_DIRS
                        value: /var/lib/kafka/data
                  securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                          drop:
                              - ALL
                  ports:
                      - containerPort: 9092
                        name: broker
                      - containerPort: 9093
                        name: controller
                  volumeMounts:
                      - name: data
                        mountPath: /var/lib/kafka/data
                  startupProbe:
                      tcpSocket:
                          port: 9092
                      failureThreshold: 30
                      periodSeconds: 10
                  readinessProbe:
                      tcpSocket:
                          port: 9092
                      initialDelaySeconds: 30
                      periodSeconds: 10
                      failureThreshold: 12
                  livenessProbe:
                      tcpSocket:
                          port: 9092
                      initialDelaySeconds: 60
                      periodSeconds: 20
                      failureThreshold: 6
                  resources:
                      requests:
                          cpu: 250m
                          memory: 512Mi
                      limits:
                          cpu: 1000m
                          memory: 1Gi
    volumeClaimTemplates:
        - metadata:
              name: data
          spec:
              accessModes:
                  - ReadWriteOnce
              resources:
                  requests:
                      storage: 2Gi
