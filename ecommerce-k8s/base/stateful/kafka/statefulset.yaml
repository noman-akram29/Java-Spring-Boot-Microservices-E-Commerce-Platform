apiVersion: apps/v1
kind: StatefulSet
metadata: { name: kafka, namespace: ecommerce }
spec:
  serviceName: kafka
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: kafka } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: kafka, workload: data, tier: stateful }
    spec:
      nodeSelector: { workload: data }
      tolerations:
        - { key: workload, operator: Equal, value: data, effect: NoSchedule }
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: kafka-config
          emptyDir: {}
        - name: kafka-logs
          emptyDir: {}
      containers:
        - name: kafka
          image: apache/kafka:3.9.0
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - {
                name: KAFKA_CONTROLLER_QUORUM_VOTERS,
                value: "1@kafka-0.kafka.ecommerce.svc.cluster.local:9093",
              }
            - {
                name: KAFKA_LISTENERS,
                value: "PLAINTEXT://:9092,CONTROLLER://:9093",
              }
            - {
                name: KAFKA_ADVERTISED_LISTENERS,
                value: "PLAINTEXT://kafka:9092",
              }
            - {
                name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP,
                value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT",
              }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT" }
            - { name: CLUSTER_ID, value: "5L6g3nShT-eMCtK--X86sw" }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports: [{ containerPort: 9092 }, { containerPort: 9093 }]
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data

            - name: kafka-config
              mountPath: /opt/kafka/config

            - name: kafka-logs
              mountPath: /opt/kafka/logs
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1000m", memory: "1Gi" }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        {
          accessModes: ["ReadWriteOnce"],
          resources: { requests: { storage: 2Gi } },
        }
