apiVersion: apps/v1
kind: StatefulSet
metadata: { name: mongodb, namespace: ecommerce }
spec:
  serviceName: mongodb
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: mongodb } }
  template:
    metadata:
      labels:
        { app.kubernetes.io/name: mongodb, workload: data, tier: stateful }
    spec:
      nodeSelector: { workload: data }
      tolerations:
        - { key: workload, operator: Equal, value: data, effect: NoSchedule }
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mongodb
          image: mongo:7
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: root
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: mongo-creds, key: password }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports: [{ containerPort: 27017 }]
          volumeMounts: [{ name: data, mountPath: /data/db }]
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1000m", memory: "1Gi" }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        {
          accessModes: ["ReadWriteOnce"],
          resources: { requests: { storage: 2Gi } },
        }
