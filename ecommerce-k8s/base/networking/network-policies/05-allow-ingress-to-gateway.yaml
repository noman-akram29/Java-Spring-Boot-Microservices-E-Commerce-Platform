apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    name: allow-ingress-to-gateway
    namespace: ecommerce
spec:
    podSelector:
        matchLabels:
            app.kubernetes.io/name: api-gateway
    policyTypes:
        - Ingress
    ingress:
        - from:
              - namespaceSelector:
                    matchLabels:
                        kubernetes.io/metadata.name: ingress-nginx
                podSelector:
                    matchLabels:
                        app.kubernetes.io/name: ingress-nginx
          ports:
              - protocol: TCP
                port: 8080
