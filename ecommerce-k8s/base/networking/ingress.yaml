apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: ecommerce-ingress
    namespace: ecommerce
    # rewrite-target annotation REMOVED — api-gateway already strips /api/<service>
    # itself (see ApiGatewayConfig.stripPrefix(2)). Rewriting here duplicated that
    # logic incorrectly and broke every route.
spec:
    ingressClassName: nginx
    rules:
        - http:
              paths:
                  - path: /
                    pathType: Prefix
                    backend:
                        service:
                            name: api-gateway
                            port:
                                number: 8080
