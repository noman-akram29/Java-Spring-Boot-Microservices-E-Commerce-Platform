apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/part-of: ecommerce
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mailpit
  ports:
    - name: ui
      port: 8025
      targetPort: 8025
    - name: smtp
      port: 1025
      targetPort: 1025
