apiVersion: apps/v1
kind: Deployment
metadata:
    name: api-gateway
    namespace: ecommerce
    labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/part-of: ecommerce
        app.kubernetes.io/component: gateway
        workload: application
        tier: stateless

spec:
    replicas: 2
    strategy:
        type: RollingUpdate
        rollingUpdate:
            maxUnavailable: 0
            maxSurge: 1
    selector:
        matchLabels:
            app.kubernetes.io/name: api-gateway

    template:
        metadata:
            labels:
                app.kubernetes.io/name: api-gateway
                app.kubernetes.io/part-of: ecommerce
                app.kubernetes.io/component: gateway
                observability: enabled
                workload: application
                tier: stateless

        spec:
            serviceAccountName: api-gateway-sa

            imagePullSecrets:
                - name: dockerhub-creds

            securityContext:
                runAsNonRoot: true
                runAsUser: 1001
                runAsGroup: 1001
                fsGroup: 1001
                seccompProfile:
                    type: RuntimeDefault

            terminationGracePeriodSeconds: 30

            affinity:
                nodeAffinity:
                    preferredDuringSchedulingIgnoredDuringExecution:
                        - weight: 100
                          preference:
                              matchExpressions:
                                  - key: workload
                                    operator: In
                                    values:
                                        - application
                podAntiAffinity:
                    preferredDuringSchedulingIgnoredDuringExecution:
                        - weight: 100
                          podAffinityTerm:
                              topologyKey: kubernetes.io/hostname
                              labelSelector:
                                  matchLabels:
                                      app.kubernetes.io/name: api-gateway
            topologySpreadConstraints:
                - maxSkew: 1
                  topologyKey: kubernetes.io/hostname
                  whenUnsatisfiable: ScheduleAnyway
                  labelSelector:
                      matchLabels:
                          app.kubernetes.io/name: api-gateway
            containers:
                - name: api-gateway
                  image: "nomanakram29/api-gateway:v2"
                  imagePullPolicy: IfNotPresent
                  ports:
                      - containerPort: 8080
                  env:
                      - name: JAVA_TOOL_OPTIONS
                        value: "-javaagent:/otel/opentelemetry-javaagent.jar"
                      - name: OTEL_SERVICE_NAME
                        value: "api-gateway"
                      - name: OTEL_EXPORTER_OTLP_ENDPOINT
                        value: "http://otel-collector.monitoring.svc.cluster.local:4317"
                      - name: OTEL_EXPORTER_OTLP_PROTOCOL
                        value: "grpc"
                      - name: OTEL_TRACES_EXPORTER
                        value: "otlp"
                      - name: OTEL_METRICS_EXPORTER
                        value: "none"
                      - name: OTEL_LOGS_EXPORTER
                        value: "none"
                  envFrom:
                      - configMapRef:
                            name: api-gateway-config

                  securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                          drop: ["ALL"]
                      readOnlyRootFilesystem: true

                  volumeMounts:
                      - name: tmp
                        mountPath: /tmp

                  startupProbe:
                      httpGet:
                          path: /actuator/health/readiness
                          port: 8080
                      failureThreshold: 30
                      periodSeconds: 5

                  readinessProbe:
                      httpGet:
                          path: /actuator/health/readiness
                          port: 8080
                      periodSeconds: 10

                  livenessProbe:
                      httpGet:
                          path: /actuator/health/liveness
                          port: 8080
                      periodSeconds: 15

                  resources:
                      requests:
                          cpu: "250m"
                          memory: "256Mi"
                      limits:
                          cpu: "1000m"
                          memory: "768Mi"

            volumes:
                - name: tmp
                  emptyDir: {}
