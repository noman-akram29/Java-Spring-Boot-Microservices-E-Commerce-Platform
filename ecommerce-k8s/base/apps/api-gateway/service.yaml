apiVersion: v1
kind: Service
metadata:
    name: api-gateway
    namespace: ecommerce
    labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/part-of: ecommerce
        observability: enabled
spec:
    type: ClusterIP
    selector:
        app.kubernetes.io/name: api-gateway
    ports:
        - name: http
          port: 8080
          targetPort: 8080
