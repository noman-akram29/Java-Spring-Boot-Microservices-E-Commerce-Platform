apiVersion: apps/v1
kind: Deployment
metadata:
    name: notification-service
    namespace: ecommerce
    labels:
        app.kubernetes.io/name: notification-service
        app.kubernetes.io/part-of: ecommerce
        app.kubernetes.io/component: backend
        workload: application
        tier: stateless
spec:
    replicas: 2
    strategy:
        type: RollingUpdate
        rollingUpdate:
            maxUnavailable: 0
            maxSurge: 1
    selector:
        matchLabels:
            app.kubernetes.io/name: notification-service
    template:
        metadata:
            labels:
                app.kubernetes.io/name: notification-service
                app.kubernetes.io/part-of: ecommerce
                app.kubernetes.io/component: backend
                observability: enabled
                workload: application
                tier: stateless
        spec:
            serviceAccountName: notification-service-sa
            imagePullSecrets:
                - name: dockerhub-creds

            securityContext:
                runAsNonRoot: true
                runAsUser: 1001
                runAsGroup: 1001
                fsGroup: 1001
                seccompProfile:
                    type: RuntimeDefault

            terminationGracePeriodSeconds: 30

            affinity:
                nodeAffinity:
                    preferredDuringSchedulingIgnoredDuringExecution:
                        - weight: 100
                          preference:
                              matchExpressions:
                                  - key: workload
                                    operator: In
                                    values:
                                        - application
                podAntiAffinity:
                    preferredDuringSchedulingIgnoredDuringExecution:
                        - weight: 100
                          podAffinityTerm:
                              labelSelector:
                                  matchLabels:
                                      app.kubernetes.io/name: notification-service
                              topologyKey: kubernetes.io/hostname
            topologySpreadConstraints:
                - maxSkew: 1
                  topologyKey: kubernetes.io/hostname
                  whenUnsatisfiable: ScheduleAnyway
                  labelSelector:
                      matchLabels:
                          app.kubernetes.io/name: notification-service

            containers:
                - name: notification-service
                  image: "nomanakram29/notification-service:v3"
                  imagePullPolicy: IfNotPresent
                  ports:
                      - containerPort: 8084
                  env:
                      - name: JAVA_TOOL_OPTIONS
                        value: "-javaagent:/otel/opentelemetry-javaagent.jar"
                      - name: OTEL_SERVICE_NAME
                        value: "notification-service"
                      - name: OTEL_EXPORTER_OTLP_ENDPOINT
                        value: "http://otel-collector.monitoring.svc.cluster.local:4317"
                      - name: OTEL_EXPORTER_OTLP_PROTOCOL
                        value: "grpc"
                      - name: OTEL_TRACES_EXPORTER
                        value: "otlp"
                      - name: OTEL_METRICS_EXPORTER
                        value: "none"
                      - name: OTEL_LOGS_EXPORTER
                        value: "none"
                  envFrom:
                      - configMapRef:
                            name: notification-service-config
                  securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                          drop: ["ALL"]
                      readOnlyRootFilesystem: true
                  volumeMounts:
                      - name: tmp
                        mountPath: /tmp
                  startupProbe:
                      httpGet:
                          path: /actuator/health/readiness
                          port: 8084
                      failureThreshold: 30
                      periodSeconds: 5
                  readinessProbe:
                      httpGet:
                          path: /actuator/health/readiness
                          port: 8084
                      initialDelaySeconds: 15
                      periodSeconds: 10
                  livenessProbe:
                      httpGet:
                          path: /actuator/health/liveness
                          port: 8084
                      initialDelaySeconds: 30
                      periodSeconds: 15
                  resources:
                      requests:
                          cpu: "100m"
                          memory: "256Mi"
                      limits:
                          cpu: "500m"
                          memory: "512Mi"
            volumes:
                - name: tmp
                  emptyDir: {}
