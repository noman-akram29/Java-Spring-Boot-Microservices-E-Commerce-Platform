# Placeholder Secret manifests required by Deployments/StatefulSets.
# Replace CHANGE_ME values before apply, or manage these Secrets out-of-band
# (ExternalSecrets, SealedSecrets, CI, etc.). Do not commit real credentials.
apiVersion: v1
kind: Secret
metadata:
    name: mysql-creds
    namespace: ecommerce
type: Opaque
stringData:
    password: "mysql123"
---
apiVersion: v1
kind: Secret
metadata:
    name: mongo-creds
    namespace: ecommerce
type: Opaque
stringData:
    password: "mongodb123"
---
apiVersion: v1
kind: Secret
metadata:
    name: product-mongo-uri
    namespace: ecommerce
type: Opaque
stringData:
    # Keys become environment variable names when consumed via secretRef (envFrom).
    # Adjust key name(s) to match what product-service expects (e.g. SPRING_DATA_MONGODB_URI).
    SPRING_DATA_MONGODB_URI: "mongodb://root:mongodb123@mongodb:27017/product_db?authSource=admin"
---
apiVersion: v1
kind: Secret
metadata:
    name: dockerhub-creds
    namespace: ecommerce
type: kubernetes.io/dockerconfigjson
stringData:
    .dockerconfigjson: |
        {"auths":{"https://index.docker.io/v1/":{"username":"Username","password":"Password/Token","auth":"VXNlcm5hbWU6UGFzc3dvcmQvVG9rZW4="}}}
