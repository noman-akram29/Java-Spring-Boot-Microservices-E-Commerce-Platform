# azure-pipelines.yml
# Production CI/CD - Step 1 Hardening with Trivy Vulnerability Scanning
# Build runs on feature/cicd + main
# Deploy runs ONLY on main

trigger:
    branches:
        include:
            - feature/cicd
            - staging
            - main

variables:
    AWS_REGION: ap-south-1
    ECR_REGISTRY: 561531407742.dkr.ecr.ap-south-1.amazonaws.com
    IMAGE_TAG: $(Build.BuildId)
    SERVICES: api-gateway product-service inventory-service order-service notification-service
    NAMESPACE: ecommerce

pool:
    name: e-commerce-pool
    demands:
        - Agent.Name -equals azuredevops-deployer

stages:
    # ------------------------------------------------
    # STAGE 1: Build, Scan & Push (can run on feature branches)
    # ------------------------------------------------
    - stage: Build
      displayName: Build, Scan & Push to ECR
      jobs:
          - job: BuildAndPush
            displayName: Build, Scan & Push immutable images
            steps:
                - checkout: self
                  clean: true
                  fetchDepth: 1

                - task: AWSCLI@1
                  displayName: "Verify AWS OIDC identity"
                  inputs:
                      awsCredentials: "AWS-ECR-OIDC"
                      regionName: $(AWS_REGION)
                      awsCommand: "sts"
                      awsSubCommand: "get-caller-identity"

                - task: AWSShellScript@1
                  displayName: "ECR Login + Build + Trivy Scan + Push"
                  inputs:
                      awsCredentials: "AWS-ECR-OIDC"
                      regionName: $(AWS_REGION)
                      scriptType: "inline"
                      inlineScript: |
                          set -euo pipefail

                          echo "=== Caller identity ==="
                          aws sts get-caller-identity

                          echo "=== Logging in to ECR ==="
                          aws ecr get-login-password --region $(AWS_REGION) | \
                            docker login --username AWS --password-stdin $(ECR_REGISTRY)

                          echo "=== Building, Scanning, and Pushing services ==="
                          for SERVICE in $(SERVICES); do
                            echo "------------------------------------------------"
                            echo "Building $SERVICE"
                            echo "------------------------------------------------"

                            DOCKER_BUILDKIT=1 docker build \
                              --tag $(ECR_REGISTRY)/ecommerce/${SERVICE}:$(IMAGE_TAG) \
                              --file ${SERVICE}/Dockerfile \
                              ${SERVICE}

                            echo "=== Trivy vulnerability scan (CRITICAL,HIGH) ==="
                            docker run --rm \
                              -v /var/run/docker.sock:/var/run/docker.sock \
                              aquasec/trivy:latest image \
                                --exit-code 1 \
                                --severity CRITICAL,HIGH \
                                --ignore-unfixed \
                                --no-progress \
                                $(ECR_REGISTRY)/ecommerce/${SERVICE}:$(IMAGE_TAG)

                            echo "✓ ${SERVICE} passed Trivy scan"

                            echo "=== Pushing $(ECR_REGISTRY)/ecommerce/${SERVICE}:$(IMAGE_TAG) ==="
                            docker push $(ECR_REGISTRY)/ecommerce/${SERVICE}:$(IMAGE_TAG)

                            echo "✓ $SERVICE done"
                          done

                          echo ""
                          echo "All images passed vulnerability gate and pushed successfully with tag: $(IMAGE_TAG)"

    # ------------------------------------------------
    # STAGE 2: Deploy (ONLY on main/staging)
    # ------------------------------------------------
    - stage: Deploy
      displayName: Deploy to Kubernetes
      dependsOn: Build
      condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/staging'))
      jobs:
          - job: DeployApps
            displayName: Deploy applications
            steps:
                - checkout: self
                  clean: true
                  fetchDepth: 1

                # ------------------------------------------------
                # 2.1 Verify all images exist in ECR (fail fast)
                # ------------------------------------------------
                - task: AWSShellScript@1
                  displayName: "Verify all images exist in ECR"
                  inputs:
                      awsCredentials: "AWS-ECR-OIDC"
                      regionName: $(AWS_REGION)
                      scriptType: "inline"
                      inlineScript: |
                          set -euo pipefail

                          REGISTRY="561531407742.dkr.ecr.ap-south-1.amazonaws.com"
                          TAG="$(Build.BuildId)"
                          SERVICES="api-gateway product-service inventory-service order-service notification-service"

                          echo "=== Verifying images exist in ECR for tag: ${TAG} ==="

                          for SERVICE in $SERVICES; do
                            IMAGE_URI="${REGISTRY}/ecommerce/${SERVICE}:${TAG}"
                            echo "Checking ${IMAGE_URI} ..."

                            aws ecr describe-images \
                              --repository-name "ecommerce/${SERVICE}" \
                              --image-ids imageTag="${TAG}" \
                              --region $(AWS_REGION) \
                              --query 'imageDetails[0].imageTags' \
                              --output text > /dev/null

                            echo "✓ ${SERVICE}:${TAG} exists"
                          done

                          echo ""
                          echo "All 5 images verified successfully."

                # ------------------------------------------------
                # 2.2 Deploy (only runs if verification passed)
                # ------------------------------------------------
                - script: |
                      set -euo pipefail

                      REGISTRY="561531407742.dkr.ecr.ap-south-1.amazonaws.com"
                      TAG="$(Build.BuildId)"
                      NS="$(NAMESPACE)"
                      SERVICES="api-gateway product-service inventory-service order-service notification-service"

                      echo "=== Deployer identity ==="
                      kubectl auth can-i patch deployments -n "$NS"
                      kubectl config current-context

                      # ------------------------------------------------
                      # 1. Update images + wait for rollout
                      # ------------------------------------------------
                      for SERVICE in $SERVICES; do
                        IMAGE="${REGISTRY}/ecommerce/${SERVICE}:${TAG}"
                        echo "------------------------------------------------"
                        echo "Updating ${SERVICE} -> ${IMAGE}"
                        kubectl set image "deployment/${SERVICE}" \
                          "${SERVICE}=${IMAGE}" \
                          -n "$NS"
                        kubectl rollout status "deployment/${SERVICE}" \
                          -n "$NS" \
                          --timeout=180s
                        echo "OK ${SERVICE} rollout completed"
                      done

                      # ------------------------------------------------
                      # 2. Production-grade post-deployment verification
                      # ------------------------------------------------
                      echo ""
                      echo "=== Post-deployment verification ==="

                      for SERVICE in $SERVICES; do
                        EXPECTED_IMAGE="${REGISTRY}/ecommerce/${SERVICE}:${TAG}"
                        echo "------------------------------------------------"
                        echo "Verifying ${SERVICE}"

                        # 2.1 Image must match exactly
                        CURRENT_IMAGE=$(kubectl get deploy "${SERVICE}" -n "$NS" \
                          -o jsonpath='{.spec.template.spec.containers[0].image}')

                        if [[ "${CURRENT_IMAGE}" != "${EXPECTED_IMAGE}" ]]; then
                          echo "ERROR: ${SERVICE} image is ${CURRENT_IMAGE}"
                          echo "        expected ${EXPECTED_IMAGE}"
                          exit 1
                        fi
                        echo "✓ Image matches: ${CURRENT_IMAGE}"

                        # 2.2 Deployment must be fully Ready
                        READY=$(kubectl get deploy "${SERVICE}" -n "$NS" -o jsonpath='{.status.readyReplicas}')
                        DESIRED=$(kubectl get deploy "${SERVICE}" -n "$NS" -o jsonpath='{.status.replicas}')

                        READY=${READY:-0}
                        DESIRED=${DESIRED:-0}

                        if [[ "${READY}" != "${DESIRED}" || "${DESIRED}" -eq 0 ]]; then
                          echo "ERROR: ${SERVICE} is not fully Ready (${READY}/${DESIRED})"
                          kubectl get pods -n "$NS" -l "app.kubernetes.io/name=${SERVICE}"
                          exit 1
                        fi
                        echo "✓ Deployment Ready ${READY}/${DESIRED}"
                      done

                      echo ""
                      echo "=== Final image list ==="
                      kubectl get deploy -n "$NS" \
                        -o custom-columns=NAME:.metadata.name,IMAGE:.spec.template.spec.containers[0].image,READY:.status.readyReplicas

                      echo ""
                      echo "All services deployed and verified successfully."
                  displayName: "Deploy apps to ecommerce namespace"
