# azure-pipelines.yml
# Production CI/CD - Step 1 Hardening with Trivy Vulnerability Scanning & Syft SBOM

trigger:
    branches:
        include:
            - feature/cicd
            - staging
            - main

variables:
    - group: ecommerce-common
    - group: ecommerce-staging
    - name: IMAGE_TAG
      value: $(Build.BuildId)

pool:
    name: $(AGENT_POOL)
    demands:
        - Agent.Name -equals $(AGENT_NAME)

stages:
    # ------------------------------------------------
    # STAGE 1: Build, Scan, SBOM & Push
    # ------------------------------------------------
    - stage: Build
      displayName: Build, Scan, SBOM & Push to ECR
      jobs:
          - job: BuildAndPush
            displayName: Build, Scan, SBOM & Push immutable images
            steps:
                - checkout: self
                  clean: true
                  fetchDepth: 1

                - script: |
                      set -euo pipefail
                      echo "=== Running unit tests ==="
                      for SERVICE in $(SERVICES); do
                        if [ -f "${SERVICE}/pom.xml" ]; then
                          echo "------------------------------------------------"
                          echo "Tests: ${SERVICE}"
                          (cd "${SERVICE}" && chmod +x mvnw && ./mvnw -B test)
                        fi
                      done
                      echo "✓ All module tests passed"
                  displayName: "Unit tests"

                # Surfaces failures in the Tests tab instead of burying them in log output.
                # Runs even when the step above fails - that is the whole point.
                - task: PublishTestResults@2
                  displayName: "Publish test results"
                  condition: succeededOrFailed()
                  inputs:
                      testResultsFormat: "JUnit"
                      testResultsFiles: "**/target/surefire-reports/TEST-*.xml"
                      mergeTestResults: true
                      failTaskOnFailedTests: true

                - task: AWSShellScript@1
                  displayName: "ECR Login + Build + Trivy + Syft + Push"
                  inputs:
                      awsCredentials: "AWS-ECR-OIDC"
                      regionName: $(AWS_REGION)
                      scriptType: "inline"
                      inlineScript: |
                          set -euo pipefail

                          REGISTRY="$(ECR_REGISTRY)"
                          TAG="$(IMAGE_TAG)"
                          SERVICES="$(SERVICES)"
                          REPORT_DIR="$(Build.ArtifactStagingDirectory)/security"
                          TRIVY_CACHE="${HOME}/.cache/trivy"

                          # Write reports straight to the staging dir. No copy step,
                          # so a failure here fails the build instead of silently
                          # publishing an empty artifact.
                          mkdir -p "${REPORT_DIR}" "${TRIVY_CACHE}"

                          echo "=== Caller identity ==="
                          aws sts get-caller-identity

                          echo "=== Logging in to ECR ==="
                          aws ecr get-login-password --region $(AWS_REGION) | \
                            docker login --username AWS --password-stdin "${REGISTRY}"

                          echo "=== Building, Scanning, SBOM Generation, and Pushing services ==="
                          for SERVICE in $SERVICES; do
                            IMAGE="${REGISTRY}/ecommerce/${SERVICE}:${TAG}"

                            echo "------------------------------------------------"
                            echo "Building ${SERVICE}"
                            echo "------------------------------------------------"
                            DOCKER_BUILDKIT=1 docker build \
                              --tag "${IMAGE}" \
                              --file "${SERVICE}/Dockerfile" \
                              "${SERVICE}"

                            # Pass 1: report only, never fails. Gives you something to
                            # triage when pass 2 kills the build.
                            echo "=== Trivy report (all severities) ==="
                            docker run --rm \
                              -v /var/run/docker.sock:/var/run/docker.sock \
                              -v "${TRIVY_CACHE}:/root/.cache/trivy" \
                              -v "${REPORT_DIR}:/out" \
                              aquasec/trivy:$(TRIVY_VERSION) image \
                                --format json \
                                --output "/out/${SERVICE}-${TAG}-trivy.json" \
                                --no-progress \
                                "${IMAGE}"

                            # Pass 2: the gate. Hits the warm DB cache, so it is fast.
                            echo "=== Trivy vulnerability gate (CRITICAL,HIGH) ==="
                            docker run --rm \
                              -v /var/run/docker.sock:/var/run/docker.sock \
                              -v "${TRIVY_CACHE}:/root/.cache/trivy" \
                              aquasec/trivy:$(TRIVY_VERSION) image \
                                --exit-code 1 \
                                --severity CRITICAL,HIGH \
                                --ignore-unfixed \
                                --no-progress \
                                "${IMAGE}"
                            echo "The ${SERVICE} passed Trivy scan 🎉"

                            echo "=== Generating Syft SBOM for ${SERVICE} ==="
                            docker run --rm \
                              -v /var/run/docker.sock:/var/run/docker.sock \
                              -v "${REPORT_DIR}:/out" \
                              anchore/syft:$(SYFT_VERSION) \
                              "${IMAGE}" \
                              -o "spdx-json=/out/${SERVICE}-${TAG}.spdx.json" \
                              -o "syft-json=/out/${SERVICE}-${TAG}.syft.json"
                            echo "SBOM generated for ${SERVICE}"

                            echo "=== Pushing ${IMAGE} ==="
                            docker push "${IMAGE}"
                            echo "The ${SERVICE} done."
                          done

                          echo ""
                          echo "All images passed vulnerability gates, generated SBOMs, and pushed successfully!"

                - task: PublishPipelineArtifact@1
                  displayName: "Publish SBOMs & vulnerability reports"
                  condition: succeededOrFailed()
                  inputs:
                      targetPath: "$(Build.ArtifactStagingDirectory)/security"
                      artifact: "security-$(Build.BuildId)"
                      publishLocation: "pipeline"

                # Self-hosted agent building 5 images per run fills the disk quietly.
                - script: |
                      docker image prune -af --filter "until=72h" || true
                      docker builder prune -af --filter "until=72h" || true
                  displayName: "Prune old Docker layers"
                  condition: always()

    # ------------------------------------------------
    # STAGE 2: Deploy (staging only)
    # ------------------------------------------------
    # NOTE: `trigger` includes main, but this condition matches staging only, so a
    # push to main builds + pushes to ECR and stops. If you want main to deploy too:
    #   condition: and(succeeded(), in(variables['Build.SourceBranch'],
    #                  'refs/heads/staging', 'refs/heads/main'))
    - stage: Deploy
      displayName: Deploy to Kubernetes
      dependsOn: Build
      condition: and(succeeded(), eq(variables['Build.SourceBranch'], variables['DEPLOY_BRANCH']))
      jobs:
          - job: DeployApps
            displayName: Deploy applications
            steps:
                # Nothing in this job reads a repo file.
                - checkout: none

                # 2.1 Verify all images exist in ECR (fail fast).
                # Redundant on a fresh run - Stage 1 just pushed them. Earns its keep
                # when you re-run this stage later against a lifecycle-pruned tag.
                - task: AWSShellScript@1
                  displayName: "Verify all images exist in ECR"
                  inputs:
                      awsCredentials: "AWS-ECR-OIDC"
                      regionName: $(AWS_REGION)
                      scriptType: "inline"
                      inlineScript: |
                          set -euo pipefail

                          TAG="$(IMAGE_TAG)"
                          SERVICES="$(SERVICES)"

                          echo "=== Verifying images exist in ECR for tag: ${TAG} ==="
                          for SERVICE in $SERVICES; do
                            echo "Checking ecommerce/${SERVICE}:${TAG} ..."
                            aws ecr describe-images \
                              --repository-name "ecommerce/${SERVICE}" \
                              --image-ids imageTag="${TAG}" \
                              --region $(AWS_REGION) \
                              --query 'imageDetails[0].imageTags' \
                              --output text > /dev/null
                            echo "✓ ${SERVICE}:${TAG} exists"
                          done

                          echo ""
                          echo "All images verified successfully."

                # 2.2 Deploy. Single pass: set image -> wait for rollout -> verify,
                # instead of two separate loops over the same service list.
                - script: |
                      set -euo pipefail

                      REGISTRY="$(ECR_REGISTRY)"
                      TAG="$(IMAGE_TAG)"
                      NS="$(NAMESPACE)"
                      SERVICES="$(SERVICES)"

                      echo "=== Deployer identity ==="
                      kubectl config current-context
                      kubectl auth can-i patch deployments -n "$NS"

                      for SERVICE in $SERVICES; do
                        IMAGE="${REGISTRY}/ecommerce/${SERVICE}:${TAG}"

                        echo "------------------------------------------------"
                        echo "Updating ${SERVICE} -> ${IMAGE}"

                        kubectl set image "deployment/${SERVICE}" \
                          "${SERVICE}=${IMAGE}" \
                          -n "$NS"

                        kubectl rollout status "deployment/${SERVICE}" \
                          -n "$NS" \
                          --timeout=180s

                        # rollout status already blocks until Ready. This re-read catches
                        # an admission controller or operator mutating the image after us.
                        CURRENT_IMAGE=$(kubectl get deploy "${SERVICE}" -n "$NS" \
                          -o jsonpath='{.spec.template.spec.containers[0].image}')
                        if [[ "${CURRENT_IMAGE}" != "${IMAGE}" ]]; then
                          echo "ERROR: ${SERVICE} image is ${CURRENT_IMAGE}"
                          echo "        expected ${IMAGE}"
                          kubectl describe deploy "${SERVICE}" -n "$NS"
                          exit 1
                        fi

                        READY=$(kubectl get deploy "${SERVICE}" -n "$NS" -o jsonpath='{.status.readyReplicas}')
                        DESIRED=$(kubectl get deploy "${SERVICE}" -n "$NS" -o jsonpath='{.status.replicas}')
                        READY=${READY:-0}
                        DESIRED=${DESIRED:-0}
                        if [[ "${READY}" != "${DESIRED}" || "${DESIRED}" -eq 0 ]]; then
                          echo "ERROR: ${SERVICE} is not fully Ready (${READY}/${DESIRED})"
                          kubectl get pods -n "$NS" -l "app.kubernetes.io/name=${SERVICE}"
                          exit 1
                        fi

                        echo "[$(date +'%H:%M:%S')] - The ${SERVICE} rolled out and verified (${READY}/${DESIRED})"
                      done

                      echo ""
                      echo "=== Final image list ==="
                      kubectl get deploy -n "$NS" \
                        -o custom-columns=NAME:.metadata.name,IMAGE:.spec.template.spec.containers[0].image,READY:.status.readyReplicas

                      echo ""
                      echo "All services deployed and verified successfully."
                  displayName: "Deploy apps to $(NAMESPACE) namespace"

                # Diagnostics on failure. Costs nothing on a green run.
                - script: |
                      NS="$(NAMESPACE)"
                      echo "=== Pods ==="
                      kubectl get pods -n "$NS" -o wide || true
                      echo "=== Recent events ==="
                      kubectl get events -n "$NS" --sort-by=.lastTimestamp | tail -40 || true
                  displayName: "Dump namespace state on failure"
                  condition: failed()
